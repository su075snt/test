<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trống Múa Lân</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2.2vh, 22px);
    padding: 10px;
    background:
      radial-gradient(80% 60% at 50% 0%, #3a0a0a 0%, transparent 60%),
      radial-gradient(70% 60% at 50% 110%, #4a1010 0%, transparent 55%),
      #0a0404;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  /* ============ SÂN KHẤU: TRỐNG + 2 CHÈNG ============ */
  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(2px, 1vw, 14px);
    width: min(98vw, 640px);
  }

  .drum-wrap {
    flex: 0 0 auto;
    position: relative;
    width: min(78vw, 56vh, 420px);
    aspect-ratio: 1;
    filter: drop-shadow(0 16px 34px rgba(0, 0, 0, .75));
  }

  .cymbal-wrap {
    flex: 0 0 auto;
    position: relative;
    width: min(22vw, 15vh, 110px);
    aspect-ratio: 1;
    cursor: pointer;
    touch-action: manipulation;
    filter: drop-shadow(0 8px 18px rgba(0, 0, 0, .65));
  }

  .cymbal-svg {
    width: 100%;
    height: 100%;
    display: block;
    transition: transform .14s cubic-bezier(.3,.9,.4,1), filter .15s ease;
    transform-origin: center;
    pointer-events: none;
  }

  .cymbal-wrap.hit .cymbal-svg {
    animation: cymbalHit .24s ease;
  }
  @keyframes cymbalHit {
    0%   { transform: scale(1) rotate(0deg); filter: brightness(1); }
    40%  { transform: scale(1.16) rotate(-8deg); filter: brightness(1.8) drop-shadow(0 0 22px rgba(200, 240, 255, .95)); }
    100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
  }

  /* ---- SVG trống ---- */
  .drum-svg {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  .zone {
    cursor: pointer;
    pointer-events: all;
    transform-box: fill-box;
    transform-origin: center;
    transition: transform .12s cubic-bezier(.3,.9,.4,1), filter .15s ease;
  }

  #zoneCenter.hit {
    transform: scale(1.055);
    filter: brightness(1.35) drop-shadow(0 0 28px rgba(255, 214, 10, .95));
  }
  #zoneRim.hit {
    transform: scale(1.022);
    filter: brightness(1.5) saturate(1.4) drop-shadow(0 0 26px rgba(255, 80, 80, .9));
  }

  /* ============ ĐIỀU KHIỂN (chỉ còn BPM) ============ */
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
  }

  .bpm-box {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 12px 8px 14px;
    border-radius: 999px;
    background: linear-gradient(180deg, #1a0808, #100404);
    border: 1px solid #3a0c08;
    box-shadow: inset 0 1px 0 rgba(255, 184, 0, .08);
  }

  .bpm-adj {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid #5a1810;
    background: linear-gradient(180deg, #2a0c08, #150404);
    color: #ffb800;
    font: inherit;
    font-size: 20px;
    font-weight: 900;
    line-height: 1;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: transform .08s, border-color .15s, color .15s;
    touch-action: manipulation;
    padding-bottom: 2px;
  }
  .bpm-adj:active { transform: scale(.9); border-color: #ffb800; }

  .bpm-val {
    min-width: 3.6ch;
    text-align: center;
    font-size: clamp(17px, 4.4vw, 21px);
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    color: #ffe066;
    letter-spacing: .02em;
  }
</style>
</head>
<body>

  <div class="stage">

    <!-- CHÈNG TRÁI -->
    <div class="cymbal-wrap" id="chengLeft">
      <svg class="cymbal-svg" viewBox="0 0 100 100">
        <defs>
          <radialGradient id="cymGrad" cx="38%" cy="34%" r="72%">
            <stop offset="0%"   stop-color="#e8fbff"/>
            <stop offset="32%"  stop-color="#8ad9e8"/>
            <stop offset="68%"  stop-color="#3a93a8"/>
            <stop offset="100%" stop-color="#0e3d4a"/>
          </radialGradient>
          <radialGradient id="cymShine" cx="34%" cy="28%" r="58%">
            <stop offset="0%"  stop-color="rgba(255,255,255,.7)"/>
            <stop offset="55%" stop-color="rgba(255,255,255,0)"/>
          </radialGradient>
          <radialGradient id="cymVig" cx="50%" cy="50%" r="55%">
            <stop offset="60%"  stop-color="rgba(0,0,0,0)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,.45)"/>
          </radialGradient>
        </defs>
        <circle cx="50" cy="50" r="49" fill="#0a0202"/>
        <circle cx="50" cy="50" r="46" fill="url(#cymGrad)" stroke="#072830" stroke-width="1.5"/>
        <circle cx="50" cy="50" r="33" fill="none" stroke="#0e3d4a" stroke-width="1" stroke-dasharray="2 3.5" opacity=".75"/>
        <circle cx="50" cy="50" r="20" fill="rgba(14,61,74,.42)"/>
        <circle cx="50" cy="50" r="20" fill="none" stroke="#0e3d4a" stroke-width="1" opacity=".8"/>
        <circle cx="50" cy="50" r="7"  fill="#072830"/>
        <circle cx="50" cy="50" r="46" fill="url(#cymShine)"/>
        <circle cx="50" cy="50" r="46" fill="url(#cymVig)"/>
      </svg>
    </div>

    <!-- TRỐNG -->
    <div class="drum-wrap">
      <svg class="drum-svg" id="drumSvg" viewBox="0 0 340 340">
        <defs>
          <radialGradient id="rimGrad" cx="50%" cy="45%" r="70%">
            <stop offset="0%"  stop-color="#e63946"/>
            <stop offset="62%" stop-color="#c1121f"/>
            <stop offset="100%" stop-color="#6a0000"/>
          </radialGradient>
          <radialGradient id="centerGrad" cx="50%" cy="42%" r="68%">
            <stop offset="0%"   stop-color="#ffe066"/>
            <stop offset="58%"  stop-color="#fcbf49"/>
            <stop offset="100%" stop-color="#b98a00"/>
          </radialGradient>
          <radialGradient id="vignette" cx="50%" cy="50%" r="55%">
            <stop offset="55%"  stop-color="rgba(0,0,0,0)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,.5)"/>
          </radialGradient>
          <radialGradient id="centerShine" cx="38%" cy="32%" r="55%">
            <stop offset="0%"  stop-color="rgba(255,255,255,.55)"/>
            <stop offset="55%" stop-color="rgba(255,255,255,0)"/>
          </radialGradient>
          <radialGradient id="rimShine" cx="42%" cy="28%" r="60%">
            <stop offset="0%"  stop-color="rgba(255,255,255,.22)"/>
            <stop offset="60%" stop-color="rgba(255,255,255,0)"/>
          </radialGradient>
        </defs>

        <circle cx="170" cy="170" r="168" fill="#150404"/>
        <circle cx="170" cy="170" r="164" fill="#0a0202"/>

        <circle id="zoneRim" class="zone" cx="170" cy="170" r="159"
                fill="url(#rimGrad)" stroke="#3a0a08" stroke-width="2"/>

        <circle cx="170" cy="170" r="140" fill="none"
                stroke="#ffd60a" stroke-width="2"
                stroke-dasharray="1.6 13" opacity=".72"
                pointer-events="none"/>
        <circle cx="170" cy="170" r="148" fill="none"
                stroke="#ffb800" stroke-width="1" opacity=".35"
                pointer-events="none"/>

        <circle cx="170" cy="170" r="101" fill="none"
                stroke="#ffd60a" stroke-width="3" pointer-events="none" opacity=".8"/>
        <circle cx="170" cy="170" r="98.5" fill="none"
                stroke="#3a0a08" stroke-width="1.5" pointer-events="none" opacity=".8"/>

        <circle id="zoneCenter" class="zone" cx="170" cy="170" r="95"
                fill="url(#centerGrad)" stroke="#7a5a00" stroke-width="2"/>

        <circle cx="170" cy="170" r="78" fill="none"
                stroke="#c1121f" stroke-width="1.6"
                stroke-dasharray="3 9" opacity=".55" pointer-events="none"/>
        <circle cx="170" cy="170" r="52" fill="rgba(193,18,31,.15)" pointer-events="none"/>
        <circle cx="170" cy="170" r="22" fill="rgba(120,0,0,.22)" pointer-events="none"/>

        <circle cx="170" cy="170" r="159" fill="url(#rimShine)" pointer-events="none"/>
        <circle cx="170" cy="170" r="95"  fill="url(#centerShine)" pointer-events="none"/>
        <circle cx="170" cy="170" r="159" fill="url(#vignette)" pointer-events="none"/>
      </svg>
    </div>

    <!-- CHÈNG PHẢI -->
    <div class="cymbal-wrap" id="chengRight">
      <svg class="cymbal-svg" viewBox="0 0 100 100">
        <defs>
          <radialGradient id="cymGrad2" cx="38%" cy="34%" r="72%">
            <stop offset="0%"   stop-color="#e8fbff"/>
            <stop offset="32%"  stop-color="#8ad9e8"/>
            <stop offset="68%"  stop-color="#3a93a8"/>
            <stop offset="100%" stop-color="#0e3d4a"/>
          </radialGradient>
          <radialGradient id="cymShine2" cx="34%" cy="28%" r="58%">
            <stop offset="0%"  stop-color="rgba(255,255,255,.7)"/>
            <stop offset="55%" stop-color="rgba(255,255,255,0)"/>
          </radialGradient>
          <radialGradient id="cymVig2" cx="50%" cy="50%" r="55%">
            <stop offset="60%"  stop-color="rgba(0,0,0,0)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,.45)"/>
          </radialGradient>
        </defs>
        <circle cx="50" cy="50" r="49" fill="#0a0202"/>
        <circle cx="50" cy="50" r="46" fill="url(#cymGrad2)" stroke="#072830" stroke-width="1.5"/>
        <circle cx="50" cy="50" r="33" fill="none" stroke="#0e3d4a" stroke-width="1" stroke-dasharray="2 3.5" opacity=".75"/>
        <circle cx="50" cy="50" r="20" fill="rgba(14,61,74,.42)"/>
        <circle cx="50" cy="50" r="20" fill="none" stroke="#0e3d4a" stroke-width="1" opacity=".8"/>
        <circle cx="50" cy="50" r="7"  fill="#072830"/>
        <circle cx="50" cy="50" r="46" fill="url(#cymShine2)"/>
        <circle cx="50" cy="50" r="46" fill="url(#cymVig2)"/>
      </svg>
    </div>

  </div>

  <div class="controls">
    <div class="bpm-box">
      <button class="bpm-adj" id="bpmDown" aria-label="Giảm nhịp">−</button>
      <span class="bpm-val" id="bpmVal">100</span>
      <button class="bpm-adj" id="bpmUp" aria-label="Tăng nhịp">+</button>
    </div>
  </div>

<script>
(() => {
  "use strict";

  /* ==========================================================
     AUDIO ENGINE
     ========================================================== */
  let actx = null, master = null, noiseBuf = null;

  function initAudio() {
    if (actx) {
      if (actx.state === "suspended") actx.resume();
      return actx;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();

    master = actx.createGain();
    master.gain.value = 0.9;

    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -8;
    comp.knee.value = 14;
    comp.ratio.value = 5;
    comp.attack.value = 0.003;
    comp.release.value = 0.18;

    master.connect(comp);
    comp.connect(actx.destination);

    const len = Math.floor(actx.sampleRate * 2);
    noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    return actx;
  }

  function noiseSource() {
    const s = actx.createBufferSource();
    s.buffer = noiseBuf;
    return s;
  }

  /* ---------- TÙNG — trống cái (trầm, ấm) ---------- */
  function soundTung(t, vel) {
    vel = vel == null ? 1 : vel;

    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(92, t);
    o.frequency.exponentialRampToValueAtTime(46, t + 0.14);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.95 * vel, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.62);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 0.66);

    const o2 = actx.createOscillator();
    const g2 = actx.createGain();
    o2.type = "sine";
    o2.frequency.setValueAtTime(180, t);
    o2.frequency.exponentialRampToValueAtTime(95, t + 0.1);
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(0.22 * vel, t + 0.006);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
    o2.connect(g2).connect(master);
    o2.start(t); o2.stop(t + 0.3);

    const n = noiseSource();
    const hp = actx.createBiquadFilter();
    hp.type = "highpass"; hp.frequency.value = 260;
    const ng = actx.createGain();
    ng.gain.setValueAtTime(0.24 * vel, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
    n.connect(hp).connect(ng).connect(master);
    n.start(t); n.stop(t + 0.05);
  }

  /* ---------- CỐC CỐC — gõ thanh gỗ ---------- */
  function soundCat(t, vel) {
    vel = vel == null ? 1 : vel;

    const o = actx.createOscillator();
    const og = actx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(880, t);
    o.frequency.exponentialRampToValueAtTime(600, t + 0.022);
    og.gain.setValueAtTime(0.0001, t);
    og.gain.exponentialRampToValueAtTime(0.78 * vel, t + 0.003);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
    o.connect(og).connect(master);
    o.start(t); o.stop(t + 0.15);

    const o2 = actx.createOscillator();
    const og2 = actx.createGain();
    o2.type = "sine";
    o2.frequency.setValueAtTime(1620, t);
    o2.frequency.exponentialRampToValueAtTime(1120, t + 0.016);
    og2.gain.setValueAtTime(0.0001, t);
    og2.gain.exponentialRampToValueAtTime(0.36 * vel, t + 0.002);
    og2.gain.exponentialRampToValueAtTime(0.001, t + 0.085);
    o2.connect(og2).connect(master);
    o2.start(t); o2.stop(t + 0.1);

    const o3 = actx.createOscillator();
    const og3 = actx.createGain();
    o3.type = "sine";
    o3.frequency.setValueAtTime(2450, t);
    o3.frequency.exponentialRampToValueAtTime(1900, t + 0.012);
    og3.gain.setValueAtTime(0.0001, t);
    og3.gain.exponentialRampToValueAtTime(0.14 * vel, t + 0.002);
    og3.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    o3.connect(og3).connect(master);
    o3.start(t); o3.stop(t + 0.06);

    const n = noiseSource();
    const bp = actx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 2600; bp.Q.value = 1.4;
    const ng = actx.createGain();
    ng.gain.setValueAtTime(0.20 * vel, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.024);
    n.connect(bp).connect(ng).connect(master);
    n.start(t); n.stop(t + 0.04);
  }

  /* ---------- BÈNG BÈNG — hai nắp nồi đập vào nhau ---------- */
  function soundBeng(t, vel) {
  vel = vel == null ? 1 : vel;
  const n = noiseSource();
  const hp = actx.createBiquadFilter();
  hp.type = "highpass"; hp.frequency.value = 6500;
  const bp = actx.createBiquadFilter();
  bp.type = "bandpass"; bp.frequency.value = 9500; bp.Q.value = 0.8;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.7 * vel, t + 0.003);
  g.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
  n.connect(hp).connect(bp).connect(g).connect(master);
  n.start(t); n.stop(t + 1.15);
  [3600, 5400, 8100, 12150, 18225].forEach((f, i) => {
    const o = actx.createOscillator();
    const og = actx.createGain();
    o.type = "square"; o.frequency.setValueAtTime(f, t);
    og.gain.setValueAtTime(0.0001, t);
    og.gain.exponentialRampToValueAtTime(0.12 * vel / (i * 0.35 + 1), t + 0.004);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
    o.connect(og).connect(master); o.start(t); o.stop(t + 1.45);
  });
}

  /* ==========================================================
     UI
     ========================================================== */
  const drumSvg   = document.getElementById("drumSvg");
  const zoneRim   = document.getElementById("zoneRim");
  const zoneCenter= document.getElementById("zoneCenter");
  const chengL    = document.getElementById("chengLeft");
  const chengR    = document.getElementById("chengRight");
  const bpmVal    = document.getElementById("bpmVal");
  const bpmUp     = document.getElementById("bpmUp");
  const bpmDown   = document.getElementById("bpmDown");

  let bpm = 100;
  bpmVal.textContent = bpm;

  /* ==========================================================
     HIT LOGIC
     ========================================================== */
  function pulseZone(kind) {
    const zone = kind === "tung" ? zoneCenter : zoneRim;
    zone.classList.remove("hit");
    void zone.getBoundingClientRect();
    zone.classList.add("hit");
    clearTimeout(zone._t);
    zone._t = setTimeout(() => zone.classList.remove("hit"), 150);
  }

  function ripple(kind) {
    const isTung = kind === "tung";
    const r0 = isTung ? 95 : 158;
    const r1 = isTung ? 148 : 163;
    const stroke = isTung ? "#fff2b0" : "#ffb0b0";

    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", "170");
    c.setAttribute("cy", "170");
    c.setAttribute("r", r0);
    c.setAttribute("fill", "none");
    c.setAttribute("stroke", stroke);
    c.setAttribute("stroke-width", isTung ? "4" : "3");
    c.setAttribute("opacity", "0.95");
    c.style.pointerEvents = "none";
    drumSvg.appendChild(c);

    const dur = isTung ? 520 : 340;
    const start = performance.now();
    function step(now) {
      const p = Math.min(1, (now - start) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      c.setAttribute("r", (r0 + (r1 - r0) * e).toFixed(2));
      c.setAttribute("opacity", (0.95 * (1 - e)).toFixed(3));
      c.setAttribute("stroke-width", ((isTung ? 4 : 3) * (1 - e * 0.7)).toFixed(2));
      if (p < 1) requestAnimationFrame(step);
      else c.remove();
    }
    requestAnimationFrame(step);
  }

  function pulseCymbals() {
    [chengL, chengR].forEach(el => {
      el.classList.remove("hit");
      void el.getBoundingClientRect();
      el.classList.add("hit");
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove("hit"), 240);
    });
  }

  function playHit(kind, vel) {
    initAudio();
    const t = actx.currentTime + 0.001;
    if (kind === "tung")       soundTung(t, vel);
    else if (kind === "cat")   soundCat(t, vel);
    else                       soundBeng(t, vel);

    if (kind === "tung" || kind === "cat") {
      pulseZone(kind);
      ripple(kind);
    } else {
      pulseCymbals();
    }
  }

  /* ==========================================================
     POINTER
     ========================================================== */
  function resolveDrumZone(target) {
    if (!target) return null;
    if (target.closest && target.closest("#zoneCenter")) return "tung";
    if (target.closest && target.closest("#zoneRim"))    return "cat";
    return null;
  }

  drumSvg.addEventListener("pointerdown", e => {
    const kind = resolveDrumZone(e.target);
    if (!kind) return;
    e.preventDefault();
    playHit(kind, 1);
  });

  [chengL, chengR].forEach(el => {
    el.addEventListener("pointerdown", e => {
      e.preventDefault();
      playHit("beng", 1);
    });
  });

  drumSvg.addEventListener("contextmenu", e => e.preventDefault());
  [chengL, chengR].forEach(el => el.addEventListener("contextmenu", e => e.preventDefault()));

  /* ==========================================================
     KEYBOARD: C · T · E
     ========================================================== */
  window.addEventListener("keydown", e => {
    if (e.repeat) return;
    const k = e.key.toLowerCase();
    if (k === "c")      { e.preventDefault(); playHit("cat", 1); }
    else if (k === "t") { e.preventDefault(); playHit("tung", 1); }
    else if (k === "e") { e.preventDefault(); playHit("beng", 1); }
  });

  /* ==========================================================
     BPM (chỉ hiển thị, không còn auto-play nên chỉ lưu giá trị)
     ========================================================== */
  function changeBpm(delta) {
    bpm = Math.max(50, Math.min(180, bpm + delta));
    bpmVal.textContent = bpm;
  }

  bpmUp.addEventListener("click", () => changeBpm(5));
  bpmDown.addEventListener("click", () => changeBpm(-5));
})();
</script>
</body>
</html>
