<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trống Múa Lân</title>

<!-- ===== iOS: lưu về màn hình chính → mở toàn màn hình, KHÔNG thanh địa chỉ/tìm kiếm ===== -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Trống Múa Lân">

<script>
  /* Đánh dấu khi app đang chạy ở chế độ đã lưu về màn hình chính (iOS) */
  if (window.navigator.standalone === true ||
      window.matchMedia('(display-mode: standalone)').matches) {
    document.documentElement.classList.add('ios-standalone');
  }
</script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2.2vh, 22px);
    padding: 10px;
    background:
      radial-gradient(80% 60% at 50% 0%, #3a0a0a 0%, transparent 60%),
      radial-gradient(70% 60% at 50% 110%, #4a1010 0%, transparent 55%),
      #0a0404;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  /* ============ SÂN KHẤU: TRỐNG + 2 CHÈNG ============ */
  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(2px, 1vw, 14px);
    width: min(98vw, 640px);
  }

  .drum-wrap {
    flex: 0 0 auto;
    position: relative;
    width: min(78vw, 56vh, 420px);
    aspect-ratio: 1;
    filter: drop-shadow(0 16px 34px rgba(0, 0, 0, .75));
  }

  .cymbal-wrap {
    flex: 0 0 auto;
    position: relative;
    width: min(22vw, 15vh, 110px);
    aspect-ratio: 1;
    cursor: pointer;
    touch-action: manipulation;
    filter: drop-shadow(0 8px 18px rgba(0, 0, 0, .65));
  }

  .cymbal-svg {
    width: 100%;
    height: 100%;
    display: block;
    transition: transform .14s cubic-bezier(.3,.9,.4,1), filter .15s ease;
    transform-origin: center;
    pointer-events: none;
  }

  .cymbal-wrap.hit .cymbal-svg {
    animation: cymbalHit .24s ease;
  }
  @keyframes cymbalHit {
    0%   { transform: scale(1) rotate(0deg); filter: brightness(1); }
    40%  { transform: scale(1.16) rotate(-8deg); filter: brightness(1.8) drop-shadow(0 0 22px rgba(200, 240, 255, .95)); }
    100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
  }

  /* ---- SVG trống ---- */
  .drum-svg {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  .zone {
    cursor: pointer;
    pointer-events: all;
    transform-box: fill-box;
    transform-origin: center;
    transition: transform .12s cubic-bezier(.3,.9,.4,1), filter .15s ease;
  }

  #zoneCenter.hit {
    transform: scale(1.055);
    filter: brightness(1.35) drop-shadow(0 0 28px rgba(255, 214, 10, .95));
  }
  #zoneRim.hit {
    transform: scale(1.022);
    filter: brightness(1.5) saturate(1.4) drop-shadow(0 0 26px rgba(255, 80, 80, .9));
  }

  /* ============ ĐIỀU KHIỂN (chỉ còn BPM) ============ */
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
  }

  .bpm-box {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 12px 8px 14px;
    border-radius: 999px;
    background: linear-gradient(180deg, #1a0808, #100404);
    border: 1px solid #3a0c08;
    box-shadow: inset 0 1px 0 rgba(255, 184, 0, .08);
  }

  .bpm-adj {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid #5a1810;
    background: linear-gradient(180deg, #2a0c08, #150404);
    color: #ffb800;
    font: inherit;
    font-size: 20px;
    font-weight: 900;
    line-height: 1;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: transform .08s, border-color .15s, color .15s;
    touch-action: manipulation;
    padding-bottom: 2px;
  }
  .bpm-adj:active { transform: scale(.9); border-color: #ffb800; }

  .bpm-val {
    min-width: 3.6ch;
    text-align: center;
    font-size: clamp(17px, 4.4vw, 21px);
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    color: #ffe066;
    letter-spacing: .02em;
  }

  /* ==========================================================
     iOS — KHI ĐÃ LƯU VỀ MÀN HÌNH CHÍNH (standalone)
     → Trống to hơn 50% so với kích thước gốc
     (dùng transform để không phá vỡ bố cục 2 chèng hai bên)
     ========================================================== */
  @media (display-mode: standalone) {
    .drum-wrap   { transform: scale(1.5); }
    .cymbal-wrap { z-index: 2; }   /* 2 chèng luôn nằm trên mặt trống */
  }
  html.ios-standalone .drum-wrap   { transform: scale(1.5); }
  html.ios-standalone .cymbal-wrap { z-index: 2; }
</style>

    <!-- CHÈNG PHẢI -->
    <div class="cymbal-wrap" id="chengRight">
      <svg class="cymbal-svg" viewBox="0 0 100 100">
        <defs>
          <radialGradient id="cymGrad2" cx="38%" cy="34%" r="72%">
            <stop offset="0%"   stop-color="#e8fbff"/>
            <stop offset="32%"  stop-color="#8ad9e8"/>
            <stop offset="68%"  stop-color="#3a93a8"/>
            <stop offset="100%" stop-color="#0e3d4a"/>
          </radialGradient>
          <radialGradient id="cymShine2" cx="34%" cy="28%" r="58%">
            <stop offset="0%"  stop-color="rgba(255,255,255,.7)"/>
            <stop offset="55%" stop-color="rgba(255,255,255,0)"/>
          </radialGradient>
          <radialGradient id="cymVig2" cx="50%" cy="50%" r="55%">

<script>
(() => {
  "use strict";

  /* ==========================================================
     AUDIO ENGINE
     ========================================================== */
  let actx = null, master = null, noiseBuf = null;

  function initAudio() {
    if (actx) {
      if (actx.state === "suspended") actx.resume();
      return actx;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();

    master = actx.createGain();
    master.gain.value = 0.9;

    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -8;
    comp.knee.value = 14;
    comp.ratio.value = 5;
    comp.attack.value = 0.003;
    comp.release.value = 0.18;

    master.connect(comp);
    comp.connect(actx.destination);

    const len = Math.floor(actx.sampleRate * 2);
    noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    return actx;
  }

  function noiseSource() {
    const s = actx.createBufferSource();
    s.buffer = noiseBuf;
    return s;
  }

  /* ---------- TÙNG — trống cái (trầm, ấm) ---------- */
  /* ---------- TÙNG — Trống lân da trâu: TRẦM, VANG, CÓ BASS ---------- */
function soundTung(t, vel) {
  vel = vel == null ? 1 : vel;

  /* ═══════════════════════════════════════════════════════════
     LỚP 1 — SUB BASS (cực trầm, cảm nhận bằng ngực)
     Tạo độ "ùm" sâu, rung lồng ngực — trái tim của trống lân
     ═══════════════════════════════════════════════════════════ */
  const sub = actx.createOscillator();
  const subG = actx.createGain();
  sub.type = "sine";
  sub.frequency.setValueAtTime(58, t);
  sub.frequency.exponentialRampToValueAtTime(32, t + 0.35);
  subG.gain.setValueAtTime(0.0001, t);
  subG.gain.exponentialRampToValueAtTime(1.05 * vel, t + 0.01);
  subG.gain.exponentialRampToValueAtTime(0.5 * vel, t + 0.4);
  subG.gain.exponentialRampToValueAtTime(0.001, t + 1.6);
  sub.connect(subG).connect(master);
  sub.start(t); sub.stop(t + 1.65);

  /* ═══════════════════════════════════════════════════════════
     LỚP 2 — BASS CHÍNH (thân trống da trâu)
     Âm trầm hùng, mạnh mẽ, ấm — đây là "giọng" chính của trống
     ═══════════════════════════════════════════════════════════ */
  const body = actx.createOscillator();
  const bodyG = actx.createGain();
  body.type = "sine";
  body.frequency.setValueAtTime(115, t);
  body.frequency.exponentialRampToValueAtTime(62, t + 0.22);
  bodyG.gain.setValueAtTime(0.0001, t);
  bodyG.gain.exponentialRampToValueAtTime(0.98 * vel, t + 0.006);
  bodyG.gain.exponentialRampToValueAtTime(0.55 * vel, t + 0.35);
  bodyG.gain.exponentialRampToValueAtTime(0.001, t + 1.15);
  body.connect(bodyG).connect(master);
  body.start(t); body.stop(t + 1.2);

  /* ═══════════════════════════════════════════════════════════
     LỚP 3 — HÀI BẬC 2 (tạo độ "dày", "nảy" của mặt da căng)
     ═══════════════════════════════════════════════════════════ */
  const harm2 = actx.createOscillator();
  const harm2G = actx.createGain();
  harm2.type = "sine";
  harm2.frequency.setValueAtTime(230, t);
  harm2.frequency.exponentialRampToValueAtTime(128, t + 0.18);
  harm2G.gain.setValueAtTime(0.0001, t);
  harm2G.gain.exponentialRampToValueAtTime(0.42 * vel, t + 0.005);
  harm2G.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
  harm2.connect(harm2G).connect(master);
  harm2.start(t); harm2.stop(t + 0.75);

  /* ═══════════════════════════════════════════════════════════
     LỚP 4 — HÀI BẬC 3 (độ "đanh" của da trâu, ngắn)
     ═══════════════════════════════════════════════════════════ */
  const harm3 = actx.createOscillator();
  const harm3G = actx.createGain();
  harm3.type = "triangle";
  harm3.frequency.setValueAtTime(345, t);
  harm3.frequency.exponentialRampToValueAtTime(195, t + 0.11);
  harm3G.gain.setValueAtTime(0.0001, t);
  harm3G.gain.exponentialRampToValueAtTime(0.20 * vel, t + 0.004);
  harm3G.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
  harm3.connect(harm3G).connect(master);
  harm3.start(t); harm3.stop(t + 0.35);

  /* ═══════════════════════════════════════════════════════════
     LỚP 5 — CÚ ĐẬP CỦA DÙI (tiếng "BỐP" da căng)
     Ngắn, tối, tạo điểm nhấn va chạm tức thời
     ═══════════════════════════════════════════════════════════ */
  const hitNoise = noiseSource();
  const hitHp = actx.createBiquadFilter();
  hitHp.type = "highpass"; hitHp.frequency.value = 180;
  const hitLp = actx.createBiquadFilter();
  hitLp.type = "lowpass"; hitLp.frequency.value = 2200;
  const hitG = actx.createGain();
  hitG.gain.setValueAtTime(0.42 * vel, t);
  hitG.gain.exponentialRampToValueAtTime(0.001, t + 0.032);
  hitNoise.connect(hitHp).connect(hitLp).connect(hitG).connect(master);
  hitNoise.start(t); hitNoise.stop(t + 0.045);

  /* ═══════════════════════════════════════════════════════════
     LỚP 6 — VANG RUNG CỦA MẶT DA (tail resonance)
     Tạo độ "vang xa" — như tiếng trống còn ngân trong không khí
     ═══════════════════════════════════════════════════════════ */
  const resonance = actx.createOscillator();
  const resonanceG = actx.createGain();
  const resLfo = actx.createOscillator();
  const resLfoG = actx.createGain();
  resonance.type = "sine";
  resonance.frequency.setValueAtTime(78, t);
  resonance.frequency.exponentialRampToValueAtTime(58, t + 0.9);
  // Rung lăn tăn nhẹ — mặt da còn rung sau khi đập
  resLfo.type = "sine";
  resLfo.frequency.value = 4.5;
  resLfoG.gain.value = 2.5;
  resLfo.connect(resLfoG).connect(resonance.frequency);
  resonanceG.gain.setValueAtTime(0.0001, t);
  resonanceG.gain.exponentialRampToValueAtTime(0.32 * vel, t + 0.05);
  resonanceG.gain.exponentialRampToValueAtTime(0.001, t + 1.9);
  resonance.connect(resonanceG).connect(master);
  resonance.start(t); resonance.stop(t + 1.95);
  resLfo.start(t); resLfo.stop(t + 1.95);

  /* ═══════════════════════════════════════════════════════════
     LỚP 7 — SUB TAIL (đuôi trầm rất dài, "ùm" tan chậm)
     Tạo cảm giác vang xa, như trống đập giữa sân đình
     ═══════════════════════════════════════════════════════════ */
  const tailSub = actx.createOscillator();
  const tailSubG = actx.createGain();
  tailSub.type = "sine";
  tailSub.frequency.setValueAtTime(48, t);
  tailSub.frequency.exponentialRampToValueAtTime(30, t + 1.4);
  tailSubG.gain.setValueAtTime(0.0001, t);
  tailSubG.gain.exponentialRampToValueAtTime(0.28 * vel, t + 0.08);
  tailSubG.gain.exponentialRampToValueAtTime(0.001, t + 2.4);
  tailSub.connect(tailSubG).connect(master);
  tailSub.start(t); tailSub.stop(t + 2.45);
}

  /* ---------- CỐC CỐC — gõ thanh gỗ ---------- */
  function soundCat(t, vel) {
    vel = vel == null ? 1 : vel;

    const o = actx.createOscillator();
    const og = actx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(880, t);
    o.frequency.exponentialRampToValueAtTime(600, t + 0.022);
    og.gain.setValueAtTime(0.0001, t);
    og.gain.exponentialRampToValueAtTime(0.78 * vel, t + 0.003);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
    o.connect(og).connect(master);
    o.start(t); o.stop(t + 0.15);

    const o2 = actx.createOscillator();
    const og2 = actx.createGain();
    o2.type = "sine";
    o2.frequency.setValueAtTime(1620, t);
    o2.frequency.exponentialRampToValueAtTime(1120, t + 0.016);
    og2.gain.setValueAtTime(0.0001, t);
    og2.gain.exponentialRampToValueAtTime(0.36 * vel, t + 0.002);
    og2.gain.exponentialRampToValueAtTime(0.001, t + 0.085);
    o2.connect(og2).connect(master);
    o2.start(t); o2.stop(t + 0.1);

    const o3 = actx.createOscillator();
    const og3 = actx.createGain();
    o3.type = "sine";
    o3.frequency.setValueAtTime(2450, t);
    o3.frequency.exponentialRampToValueAtTime(1900, t + 0.012);
    og3.gain.setValueAtTime(0.0001, t);
    og3.gain.exponentialRampToValueAtTime(0.14 * vel, t + 0.002);
    og3.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    o3.connect(og3).connect(master);
    o3.start(t); o3.stop(t + 0.06);

    const n = noiseSource();
    const bp = actx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 2600; bp.Q.value = 1.4;
    const ng = actx.createGain();
    ng.gain.setValueAtTime(0.20 * vel, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.024);
    n.connect(bp).connect(ng).connect(master);
    n.start(t); n.stop(t + 0.04);
  }

  /* ---------- BÈNG BÈNG — hai nắp nồi đập vào nhau ---------- */
/* ---------- BÈNG — HAI NẮP NỒI INOX ĐẬP NHAU ---------- */
function soundBeng(t, vel) {
  vel = vel == null ? 1 : vel;

  /* ═══════════════════════════════════════════════════════════
     LỚP 1 — CÚ ĐẬP "CẮC" (tức thời, đanh, sắc)
     Inox mỏng va vào nhau → attack siêu nhanh, sắc như dao
     ═══════════════════════════════════════════════════════════ */
  const clash = noiseSource();
  const clashHp = actx.createBiquadFilter();
  clashHp.type = "highpass"; clashHp.frequency.value = 58000;
  const clashBp = actx.createBiquadFilter();
  clashBp.type = "bandpass"; clashBp.frequency.value = 86000; clashBp.Q.value = 0.55;
  const clashG = actx.createGain();
  clashG.gain.setValueAtTime(0.0001, t);
  clashG.gain.exponentialRampToValueAtTime(1.2 * vel, t + 0.0005);
  clashG.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
  clash.connect(clashHp).connect(clashBp).connect(clashG).connect(master);
  clash.start(t); clash.stop(t + 0.055);

  /* ═══════════════════════════════════════════════════════════
     LỚP 2 — CLICK INOX (tiếng "KÍP" kim loại mỏng, sắc)
     Nắp nồi inox mỏng nên click rất sắc, rất cao
     ═══════════════════════════════════════════════════════════ */
  const click = noiseSource();
  const clickBp = actx.createBiquadFilter();
  clickBp.type = "bandpass"; clickBp.frequency.value = 15200; clickBp.Q.value = 3.5;
  const clickHp = actx.createBiquadFilter();
  clickHp.type = "highpass"; clickHp.frequency.value = 10500;
  const clickG = actx.createGain();
  clickG.gain.setValueAtTime(0.0001, t);
  clickG.gain.exponentialRampToValueAtTime(0.78 * vel, t + 0.0006);
  clickG.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
  click.connect(clickBp).connect(clickHp).connect(clickG).connect(master);
  click.start(t); click.stop(t + 0.09);

  /* ═══════════════════════════════════════════════════════════
     LỚP 3 — 14 HÀI INOX MỎNG (kim loại mỏng có phổ hài rộng)
     Inox mỏng → nhiều hài cao, lệch chuẩn, ngân ngắn
     Đây là "linh hồn" của tiếng nắp nồi inox
     ═══════════════════════════════════════════════════════════ */
  const partials = [
    // Hài thấp — "thân" nắp nồi (mỏng nên vẫn có chút trầm)
    [780,  0.32, 1.1, "sine"],
    [1240, 0.30, 1.05, "sine"],
    // Hài trung — "cang" kim loại
    [1960, 0.32, 1.0, "square"],
    [2840, 0.34, 0.95, "square"],
    [3880, 0.36, 0.9, "square"],
    // Hài cao — "xèng" inox đặc trưng
    [5120, 0.38, 0.85, "square"],
    [6580, 0.40, 0.8, "square"],
    [8240, 0.38, 0.75, "square"],
    [10100, 0.36, 0.7, "square"],
    [12200, 0.32, 0.65, "square"],
    [14500, 0.28, 0.6, "square"],
    // Hài siêu cao — "tít" inox chói
    [17000, 0.22, 0.55, "square"],
    [19600, 0.16, 0.45, "square"],
    [22400, 0.10, 0.35, "square"]
  ];

  partials.forEach(([f, a, d, wave]) => {
    const o = actx.createOscillator();
    const og = actx.createGain();
    o.type = wave;
    o.frequency.setValueAtTime(f, t);
    // Rung mạnh hơn — inox mỏng rung dữ khi va
    o.frequency.exponentialRampToValueAtTime(f * 0.955, t + d);
    og.gain.setValueAtTime(0.0001, t);
    og.gain.exponentialRampToValueAtTime(a * vel, t + 0.0012);
    og.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(og).connect(master);
    o.start(t); o.stop(t + d + 0.05);
  });

  /* ═══════════════════════════════════════════════════════════
     LỚP 4 — FLUTTER (rung lăn tăn của inox mỏng)
     2 tần số gần nhau tạo dao động "loang loáng"
     ═══════════════════════════════════════════════════════════ */
  [3800, 3838].forEach(f => {
    const o = actx.createOscillator();
    const og = actx.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(f, t);
    og.gain.setValueAtTime(0.0001, t);
    og.gain.exponentialRampToValueAtTime(0.18 * vel, t + 0.003);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
    o.connect(og).connect(master);
    o.start(t); o.stop(t + 1.15);
  });
  [8600, 8650].forEach(f => {
    const o = actx.createOscillator();
    const og = actx.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(f, t);
    og.gain.setValueAtTime(0.0001, t);
    og.gain.exponentialRampToValueAtTime(0.15 * vel, t + 0.003);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
    o.connect(og).connect(master);
    o.start(t); o.stop(t + 0.95);
  });

  /* ═══════════════════════════════════════════════════════════
     LỚP 5 — VIBRATO INOX (rung "loang loáng" kim loại mỏng)
     ═══════════════════════════════════════════════════════════ */
  const vib = actx.createOscillator();
  const vibG = actx.createGain();
  const lfo = actx.createOscillator();
  const lfoG = actx.createGain();
  vib.type = "square";
  vib.frequency.setValueAtTime(4200, t);
  lfo.type = "sine";
  lfo.frequency.value = 11;    // rung nhanh — inox mỏng rung nhanh
  lfoG.gain.value = 32;         // ±32Hz — rung mạnh
  lfo.connect(lfoG).connect(vib.frequency);
  vibG.gain.setValueAtTime(0.0001, t);
  vibG.gain.exponentialRampToValueAtTime(0.14 * vel, t + 0.004);
  vibG.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
  vib.connect(vibG).connect(master);
  vib.start(t); vib.stop(t + 1.25);
  lfo.start(t); lfo.stop(t + 1.25);

  /* ═══════════════════════════════════════════════════════════
     LỚP 6 — WASH "XÈÈÈNG" (đuôi ngân inox, sáng, ngắn)
     Nắp nồi inox ngân không lâu như chiêng — tắt nhanh
     ═══════════════════════════════════════════════════════════ */
  const wash = noiseSource();
  const washHp = actx.createBiquadFilter();
  washHp.type = "highpass"; washHp.frequency.value = 9200;
  const washBp = actx.createBiquadFilter();
  washBp.type = "bandpass"; washBp.frequency.value = 12800; washBp.Q.value = 0.6;
  const washG = actx.createGain();
  washG.gain.setValueAtTime(0.0001, t);
  washG.gain.exponentialRampToValueAtTime(0.62 * vel, t + 0.004);
  washG.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
  wash.connect(washHp).connect(washBp).connect(washG).connect(master);
  wash.start(t); wash.stop(t + 1.45);

  /* ═══════════════════════════════════════════════════════════
     LỚP 7 — ĐUÔI "TÍT" SIÊU CAO (inox mỏng chói tận cùng)
     ═══════════════════════════════════════════════════════════ */
  const tail = noiseSource();
  const tailHp = actx.createBiquadFilter();
  tailHp.type = "highpass"; tailHp.frequency.value = 15000;
  const tailBp = actx.createBiquadFilter();
  tailBp.type = "bandpass"; tailBp.frequency.value = 17800; tailBp.Q.value = 1.3;
  const tailG = actx.createGain();
  tailG.gain.setValueAtTime(0.0001, t);
  tailG.gain.exponentialRampToValueAtTime(0.28 * vel, t + 0.007);
  tailG.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
  tail.connect(tailHp).connect(tailBp).connect(tailG).connect(master);
  tail.start(t); tail.stop(t + 1.05);

  /* ═══════════════════════════════════════════════════════════
     LỚP 8 — RING "TÍT TÍT" (tiếng the thé inox còn vang)
     ═══════════════════════════════════════════════════════════ */
  const ring = actx.createOscillator();
  const ringG = actx.createGain();
  ring.type = "sine";
  ring.frequency.setValueAtTime(19500, t);
  ring.frequency.exponentialRampToValueAtTime(18200, t + 0.9);
  ringG.gain.setValueAtTime(0.0001, t);
  ringG.gain.exponentialRampToValueAtTime(0.12 * vel, t + 0.005);
  ringG.gain.exponentialRampToValueAtTime(0.0001, t + 1.0);
  ring.connect(ringG).connect(master);
  ring.start(t); ring.stop(t + 1.05);
}

  /* ==========================================================
     UI
     ========================================================== */
  const drumSvg   = document.getElementById("drumSvg");
  const zoneRim   = document.getElementById("zoneRim");
  const zoneCenter= document.getElementById("zoneCenter");
  const chengL    = document.getElementById("chengLeft");
  const chengR    = document.getElementById("chengRight");
  const bpmVal    = document.getElementById("bpmVal");
  const bpmUp     = document.getElementById("bpmUp");
  const bpmDown   = document.getElementById("bpmDown");

  let bpm = 100;
  bpmVal.textContent = bpm;

  /* ==========================================================
     HIT LOGIC
     ========================================================== */
  function pulseZone(kind) {
    const zone = kind === "tung" ? zoneCenter : zoneRim;
    zone.classList.remove("hit");
    void zone.getBoundingClientRect();
    zone.classList.add("hit");
    clearTimeout(zone._t);
    zone._t = setTimeout(() => zone.classList.remove("hit"), 150);
  }

  function ripple(kind) {
    const isTung = kind === "tung";
    const r0 = isTung ? 95 : 158;
    const r1 = isTung ? 148 : 163;
    const stroke = isTung ? "#fff2b0" : "#ffb0b0";

    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", "170");
    c.setAttribute("cy", "170");
    c.setAttribute("r", r0);
    c.setAttribute("fill", "none");
    c.setAttribute("stroke", stroke);
    c.setAttribute("stroke-width", isTung ? "4" : "3");
    c.setAttribute("opacity", "0.95");
    c.style.pointerEvents = "none";
    drumSvg.appendChild(c);

    const dur = isTung ? 520 : 340;
    const start = performance.now();
    function step(now) {
      const p = Math.min(1, (now - start) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      c.setAttribute("r", (r0 + (r1 - r0) * e).toFixed(2));
      c.setAttribute("opacity", (0.95 * (1 - e)).toFixed(3));
      c.setAttribute("stroke-width", ((isTung ? 4 : 3) * (1 - e * 0.7)).toFixed(2));
      if (p < 1) requestAnimationFrame(step);
      else c.remove();
    }
    requestAnimationFrame(step);
  }

  function pulseCymbals() {
    [chengL, chengR].forEach(el => {
      el.classList.remove("hit");
      void el.getBoundingClientRect();
      el.classList.add("hit");
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove("hit"), 240);
    });
  }

  function playHit(kind, vel) {
    initAudio();
    const t = actx.currentTime + 0.001;
    if (kind === "tung")       soundTung(t, vel);
    else if (kind === "cat")   soundCat(t, vel);
    else                       soundBeng(t, vel);

    if (kind === "tung" || kind === "cat") {
      pulseZone(kind);
      ripple(kind);
    } else {
      pulseCymbals();
    }
  }

  /* ==========================================================
     POINTER
     ========================================================== */
  function resolveDrumZone(target) {
    if (!target) return null;
    if (target.closest && target.closest("#zoneCenter")) return "tung";
    if (target.closest && target.closest("#zoneRim"))    return "cat";
    return null;
  }

  drumSvg.addEventListener("pointerdown", e => {
    const kind = resolveDrumZone(e.target);
    if (!kind) return;
    e.preventDefault();
    playHit(kind, 1);
  });

  [chengL, chengR].forEach(el => {
    el.addEventListener("pointerdown", e => {
      e.preventDefault();
      playHit("beng", 1);
    });
  });

  drumSvg.addEventListener("contextmenu", e => e.preventDefault());
  [chengL, chengR].forEach(el => el.addEventListener("contextmenu", e => e.preventDefault()));

  /* ==========================================================
     KEYBOARD: C · T · E
     ========================================================== */
  window.addEventListener("keydown", e => {
    if (e.repeat) return;
    const k = e.key.toLowerCase();
    if (k === "c")      { e.preventDefault(); playHit("cat", 1); }
    else if (k === "t") { e.preventDefault(); playHit("tung", 1); }
    else if (k === "e") { e.preventDefault(); playHit("beng", 1); }
  });

  /* ==========================================================
     BPM (chỉ hiển thị, không còn auto-play nên chỉ lưu giá trị)
     ========================================================== */
  function changeBpm(delta) {
    bpm = Math.max(50, Math.min(180, bpm + delta));
    bpmVal.textContent = bpm;
  }

  bpmUp.addEventListener("click", () => changeBpm(5));
  bpmDown.addEventListener("click", () => changeBpm(-5));
})();
</script>
</body>
</html>
