<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chiến Trường Âm Thanh</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Chiến Trường">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }

  body {
    background:
      radial-gradient(80% 50% at 50% 0%, #3a0a0a 0%, transparent 60%),
      radial-gradient(70% 50% at 50% 110%, #4a1010 0%, transparent 55%),
      #0a0404;
    color: #ffb800;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    overflow-x: hidden;
    padding-bottom: 30px;
  }

  .header {
    position: sticky;
    top: 0;
    z-index: 10;
    padding: 10px 12px 12px;
    background: linear-gradient(180deg, rgba(10,4,4,.98) 0%, rgba(10,4,4,.9) 80%, rgba(10,4,4,0) 100%);
    text-align: center;
  }
  .title {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: .18em;
    color: #ffb800;
    text-shadow: 0 0 12px rgba(255,184,0,.55);
  }
  .subtitle {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .08em;
    color: #c08600;
    opacity: .85;
    margin-top: 2px;
  }

  .stop-all {
    margin-top: 8px;
    padding: 6px 18px;
    border-radius: 999px;
    border: 1px solid #c1121f;
    background: linear-gradient(180deg, #2a0c08, #150404);
    color: #ff5a5a;
    font: inherit;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: .08em;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-transition: background .15s, color .15s, transform .08s;
    transition: background .15s, color .15s, transform .08s;
  }
  .stop-all:active {
    -webkit-transform: scale(.92);
    transform: scale(.92);
    background: linear-gradient(180deg, #c1121f, #6a0000);
    color: #fff;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
    padding: 4px 8px 0;
    max-width: 560px;
    margin: 0 auto;
  }
  @media (min-width: 620px) {
    .grid { grid-template-columns: repeat(6, 1fr); max-width: 820px; gap: 9px; }
  }
  @media (min-width: 980px) {
    .grid { grid-template-columns: repeat(8, 1fr); max-width: 1100px; gap: 10px; }
  }

  .pad {
    position: relative;
    width: 100%;
    height: 0;
    padding: 0 0 100% 0;
    border: none;
    background: none;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-appearance: none;
    appearance: none;
    font: inherit;
  }

  .pad-in {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 11px;
    border: 1.5px solid #5a1810;
    background: linear-gradient(180deg, #2a0c08, #150404);
    box-shadow: inset 0 1px 0 rgba(255,184,0,.08);
    -webkit-transition: background .15s, box-shadow .15s, border-color .15s, -webkit-transform .08s;
    transition: background .15s, box-shadow .15s, border-color .15s, transform .08s;
    overflow: hidden;
  }
  .pad:active .pad-in {
    -webkit-transform: scale(.94);
    transform: scale(.94);
  }

  .pad-img {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100%;
    height: 100%;
    -o-object-fit: cover;
    object-fit: cover;
    display: block;
    z-index: 1;
    pointer-events: none;
    border-radius: 10px;
  }

  .num {
    position: absolute;
    top: 3px;
    left: 5px;
    z-index: 3;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: .02em;
    color: #ffb800;
    text-shadow: 0 1px 2px #000, 0 0 6px #000, 0 0 10px #000;
    pointer-events: none;
    line-height: 1;
    padding: 1px 3px;
    border-radius: 3px;
    background: rgba(0,0,0,.45);
    -webkit-transition: color .15s, background .15s;
    transition: color .15s, background .15s;
  }
  .pad.playing .num {
    color: #fff;
    background: rgba(193,18,31,.85);
  }

  .pad.playing .pad-in {
    border-color: #ffd60a;
    box-shadow: 0 0 18px rgba(255,140,0,.9),
                inset 0 0 22px rgba(255,120,0,.5);
    -webkit-animation: padPulse .55s ease infinite alternate;
    animation: padPulse .55s ease infinite alternate;
  }
  .pad.playing .pad-img {
    -webkit-filter: brightness(1.35) saturate(1.3);
    filter: brightness(1.35) saturate(1.3);
  }
  @-webkit-keyframes padPulse {
    from { box-shadow: 0 0 10px rgba(255,140,0,.55), inset 0 0 14px rgba(255,120,0,.3); }
    to   { box-shadow: 0 0 24px rgba(255,180,0,.95), inset 0 0 26px rgba(255,150,0,.6); }
  }
  @keyframes padPulse {
    from { box-shadow: 0 0 10px rgba(255,140,0,.55), inset 0 0 14px rgba(255,120,0,.3); }
    to   { box-shadow: 0 0 24px rgba(255,180,0,.95), inset 0 0 26px rgba(255,150,0,.6); }
  }
</style>
</head>
<body>



<div class="grid" id="grid"></div>

<script>
(function () {
  "use strict";

  /* ==========================================================
     HELPERS
     ========================================================== */
  function addClass(el, cls) {
    if (el.classList) el.classList.add(cls);
    else if (el.className.indexOf(cls) < 0) el.className += ' ' + cls;
  }
  function removeClass(el, cls) {
    if (el.classList) el.classList.remove(cls);
    else el.className = el.className.replace(new RegExp('(^|\\s)' + cls + '(\\s|$)', 'g'), ' ').replace(/^\s+|\s+$/g, '');
  }

  function addTap(el, fn) {
    var lastTouch = 0;
    function wrap(e) {
      if (e.type === 'touchstart') lastTouch = Date.now();
      else if (e.type === 'mousedown' && Date.now() - lastTouch < 600) return;
      if (e.cancelable) e.preventDefault();
      fn(e);
    }
    if (window.PointerEvent && !/iPad|iPhone|iPod/.test(navigator.userAgent)) {
      el.addEventListener('pointerdown', wrap, { passive: false });
    } else {
      el.addEventListener('touchstart', wrap, { passive: false });
      el.addEventListener('mousedown', wrap);
    }
  }

  /* Tên file: 1 → "A01", 32 → "A32" */
  function fileName(n) {
    return "A" + (n < 10 ? "0" : "") + n;
  }

  /* ==========================================================
     UNLOCK AUDIO iOS — phát WAV im lặng để mở kênh media
     ========================================================== */
  var mediaUnlocked = false;
  var SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
  function unlockMedia() {
    if (mediaUnlocked) return;
    mediaUnlocked = true;
    try {
      var s = new Audio();
      s.src = SILENT_WAV;
      s.volume = 0.001;
      var p = s.play();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }

  /* ==========================================================
     SINH 32 Ô TỰ ĐỘNG
     ========================================================== */
  var grid = document.getElementById("grid");
  var TOTAL = 32;

  var audios = {};
  var buttons = {};

  /* Chỉ cho phép 1 ô phát tại một thời điểm */
  var currentKey = null;

  for (var i = 1; i <= TOTAL; i++) {
    var key = fileName(i);
    var imgSrc = key + ".png";
    var mp3Src = key + ".mp3";

    var btn = document.createElement("button");
    btn.className = "pad";
    btn.setAttribute("data-key", key);

    var inner = document.createElement("span");
    inner.className = "pad-in";

    var img = document.createElement("img");
    img.className = "pad-img";
    img.alt = "";
    img.setAttribute("draggable", "false");
    img.onerror = function () {
      this.style.display = "none";
    };
    img.src = imgSrc;

    var num = document.createElement("span");
    num.className = "num";
    num.textContent = key;

    inner.appendChild(img);
    inner.appendChild(num);
    btn.appendChild(inner);
    grid.appendChild(btn);

    var a = new Audio();
    a.preload = "none";
    a.loop = true;
    a.setAttribute("playsinline", "");
    a.setAttribute("webkit-playsinline", "");
    a.src = mp3Src;

    a.addEventListener("error", function () {});

    audios[key] = a;
    buttons[key] = btn;

    (function (k, el, audio) {
      addTap(el, function () {
        unlockMedia();

        /* Nếu đang phát chính ô này → tắt */
        if (currentKey === k) {
          try {
            audio.pause();
            audio.currentTime = 0;
          } catch (e) {}
          removeClass(el, "playing");
          currentKey = null;
          return;
        }

        /* Nếu có ô khác đang phát → dừng ô đó trước */
        if (currentKey && audios[currentKey]) {
          var prevAudio = audios[currentKey];
          var prevBtn = buttons[currentKey];
          try {
            prevAudio.pause();
            prevAudio.currentTime = 0;
          } catch (e) {}
          if (prevBtn) removeClass(prevBtn, "playing");
          currentKey = null;
        }

        /* Phát ô mới */
        try {
          audio.currentTime = 0;
          var p = audio.play();
          if (p && p.catch) {
            p.catch(function (err) {
              console.warn("Không phát được " + k + ".mp3:", err);
            });
          }
          addClass(el, "playing");
          currentKey = k;
        } catch (e) {
          console.warn(e);
        }
      });

      el.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    })(key, btn, a);
  }

  /* ==========================================================
     NÚT "TẮT HẾT"
     ========================================================== */
  var stopAllBtn = document.getElementById("stopAll");
  if (stopAllBtn) {
    addTap(stopAllBtn, function () {
      for (var k in audios) {
        if (!audios.hasOwnProperty(k)) continue;
        var audio = audios[k];
        try {
          audio.pause();
          audio.currentTime = 0;
        } catch (e) {}
        if (buttons[k]) removeClass(buttons[k], "playing");
      }
      currentKey = null;
    });
  }

  /* ==========================================================
     TỰ ĐỘNG DỪNG KHI ẨN TAB
     ========================================================== */
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      for (var k in audios) {
        if (!audios.hasOwnProperty(k)) continue;
        try {
          audios[k].pause();
        } catch (e) {}
      }
    }
  });

})();
</script>

</body>
</html>
