<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kanji Lớp 1">
    <title>Kanji Lớp 1 · Tập viết</title>
    <style>
        :root {
            --danger: #d63031;
            --bg: #ffffff;
            --header-bg: #f8f9fa;
            --info-bg: #fafbfd;
            --border: #e2e8f0;
            --search-bg: #f1f3f5;
            --search-text: #1a1a2e;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* ─── HOME SCREEN ─── */
        #home-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom) 15px;
            overflow-y: auto;
        }

        .home-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0 6px 0;
            flex-wrap: wrap;
            gap: 10px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
        }
        .home-header h2 {
            font-size: 20px;
            font-weight: 700;
            white-space: nowrap;
            margin: 0;
        }

        .search-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 0 1 auto;
            min-width: 140px;
            max-width: 260px;
        }
        .search-wrap input {
            width: 100%;
            padding: 8px 12px;
            border: 1.5px solid #d0d7de;
            border-radius: 24px;
            font-size: 15px;
            background: var(--search-bg);
            color: var(--search-text);
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        .search-wrap input::placeholder {
            color: #9aa0a8;
            font-size: 14px;
            opacity: 0.8;
        }
        .search-wrap input:focus {
            border-color: #4a6cf7;
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.15);
            background: #fff;
        }
        .search-wrap .clear-search {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #8b95a5;
            padding: 4px 6px;
            border-radius: 50%;
            display: none;
            transition: background 0.15s;
            line-height: 1;
        }
        .search-wrap .clear-search:hover {
            background: #e9ecef;
        }
        .search-wrap .clear-search.visible {
            display: block;
        }

        .grid-kanji {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 12px;
            padding: 16px 0 50px 0;
        }
        .card-kanji {
            aspect-ratio: 1/1;
            border: 1.5px solid #333;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 7vw;
            font-weight: 600;
            cursor: pointer;
            background: white;
            transition: 0.2s;
        }
        .card-kanji.hidden {
            display: none;
        }
        @media (min-width: 400px) {
            .card-kanji {
                font-size: 28px;
            }
        }
        @media (max-width: 300px) {
            .card-kanji {
                font-size: 20px;
            }
        }
        .card-kanji:active {
            background: #f0f0f0;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 0;
            color: #8b95a5;
            font-size: 16px;
            display: none;
        }
        .no-results.visible {
            display: block;
        }

        /* ─── LEARN SCREEN ─── */
        #learn-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: white;
            display: none;
            flex-direction: column;
            z-index: 100;
        }

        .nav-top {
            padding: 10px 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
            background: var(--header-bg);
            padding-top: max(10px, env(safe-area-inset-top));
            padding-left: max(15px, env(safe-area-inset-left));
            padding-right: max(15px, env(safe-area-inset-right));
            flex-shrink: 0;
        }
        .nav-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn-nav {
            padding: 8px 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            background: #eee;
            color: #333;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        .btn-nav:active {
            opacity: 0.7;
        }
        .btn-back {
            background: #e0e0e0;
        }
        .btn-clear {
            background: var(--danger);
            color: white;
        }
        .btn-prev-next {
            background: #ffffff;
            border: 1px solid #aaa;
        }
        #current-title {
            font-size: 20px;
            font-weight: 700;
            margin: 0 5px;
            text-align: center;
            flex: 0 1 auto;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 40%;
        }

        .nav-search {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 0 1 auto;
            min-width: 100px;
            max-width: 180px;
        }
        .nav-search input {
            width: 100%;
            padding: 6px 10px;
            border: 1.5px solid #d0d7de;
            border-radius: 20px;
            font-size: 14px;
            background: #fff;
            color: var(--search-text);
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        .nav-search input::placeholder {
            color: #9aa0a8;
            font-size: 13px;
            opacity: 0.8;
        }
        .nav-search input:focus {
            border-color: #4a6cf7;
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.12);
        }
        .nav-search .goto-btn {
            background: #4a6cf7;
            border: none;
            color: #fff;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.2s;
        }
        .nav-search .goto-btn:active {
            opacity: 0.7;
        }
        .nav-search .goto-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        /* ─── MAIN VIEW (60/40) ─── */
        .main-view {
            flex: 1;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            min-height: 0;
        }

        .left-panel {
            flex: 0 0 60%;
            display: flex;
            flex-direction: column;
            background: var(--info-bg);
            border-right: 1px solid var(--border);
            height: 100%;
        }
        .right-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: white;
            height: 100%;
        }

        /* ─── left-top: chỉ còn ảnh GIF ─── */
        .left-top {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-bottom: 1px solid var(--border);
            min-height: 80px;
            overflow: hidden;
            padding: 0;
            gap: 0;
        }
        .left-top .gif-wrap {
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .left-top .gif-wrap img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .left-bottom {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            background: #fafbfd;
            overflow: hidden;
            gap: 6px;
        }

        /* ─── READING AREA (3 dòng) ─── */
        .reading-area {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 4px 0 6px 0;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .reading-line {
            display: flex;
            align-items: baseline;
            font-size: 15px;
            font-weight: 500;
            color: #2d3748;
        }
        .reading-line .label {
            font-weight: 600;
            color: #4a5568;
            margin-right: 6px;
        }
        .reading-line .value {
            background: #f1f5f9;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 500;
        }
        .reading-line .stroke-display {
            background: #e9edf4;
            color: #2d3748;
        }

        .vocab-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .vocab-area .vocab-title {
            font-weight: 600;
            font-size: 14px;
            color: #4a5568;
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }
        .vocab-area .vocab-table-wrap {
            flex: 1;
            overflow-y: auto;
        }
        .vocab-area .vocab-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .vocab-area .vocab-table th {
            text-align: left;
            font-weight: 600;
            color: #4a5568;
            border-bottom: 1px solid var(--border);
            padding: 6px 4px 6px 0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .vocab-area .vocab-table td {
            padding: 8px 4px 8px 0;
            border-bottom: 1px solid #f0f4f8;
            vertical-align: middle;
        }
        .vocab-area .vocab-table tr:last-child td {
            border-bottom: none;
        }
        .vocab-area .vocab-table .kanji-col {
            font-weight: 600;
        }
        .vocab-area .vocab-table .reading-col {
            color: #2d3748;
            font-family: "SF Mono", monospace;
        }
        .vocab-area .vocab-table .meaning-col {
            color: #4a5568;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: white;
            container-type: size;
        }
        canvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            display: block;
            background-image: linear-gradient(#f0f0f0 1px, transparent 1px),
                linear-gradient(90deg, #f0f0f0 1px, transparent 1px);
            background-size: 20% 20%;
        }
        #trace-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(0, 0, 0, 0.05);
            pointer-events: none;
            white-space: nowrap;
            line-height: 1;
            font-size: 40vw;
        }
        @container (min-width: 1px) {
            #trace-text {
                font-size: min(70cqi, 70cqh);
            }
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 640px) {
            .main-view {
                flex-direction: column;
            }
            .left-panel {
                flex: none;
                width: 100%;
                height: 50vh;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .right-panel {
                height: 50vh;
                width: 100%;
                flex: none;
            }
            .left-top {
                flex: 1;
                min-height: 80px;
            }
            .left-bottom {
                flex: 1;
                min-height: 100px;
            }
            .reading-line {
                font-size: 14px;
            }
            .nav-search {
                min-width: 80px;
                max-width: 140px;
            }
            .nav-search input {
                font-size: 13px;
                padding: 5px 8px;
            }
            .nav-search .goto-btn {
                font-size: 12px;
                padding: 5px 8px;
            }
            .home-header {
                flex-wrap: wrap;
            }
            .home-header h2 {
                font-size: 17px;
            }
            .search-wrap {
                min-width: 100px;
                max-width: 200px;
            }
            .search-wrap input {
                font-size: 14px;
                padding: 6px 10px;
            }
        }
        @media (max-width: 400px) {
            .left-panel {
                height: 45vh;
            }
            .right-panel {
                height: 55vh;
            }
            .nav-search {
                min-width: 60px;
                max-width: 110px;
            }
            .nav-search input {
                font-size: 12px;
                padding: 4px 6px;
            }
            .nav-search .goto-btn {
                font-size: 11px;
                padding: 4px 6px;
            }
            .search-wrap {
                min-width: 80px;
                max-width: 160px;
            }
            .search-wrap input {
                font-size: 13px;
                padding: 5px 8px;
            }
        }
    </style>
</head>
<body>

    <!-- ═══ HOME SCREEN ═══ -->
    <div id="home-screen">
        <div class="home-header">
            <h2>Kanji mới</h2>
            <div class="search-wrap">
                <input type="text" id="homeSearch" placeholder="🔍 Kanji・Hiragana・Romaji" autocomplete="off">
                <button class="clear-search" id="clearSearchBtn" aria-label="Xóa tìm kiếm">✕</button>
            </div>
        </div>
        <div class="grid-kanji" id="kanjiGrid"></div>
        <div class="no-results" id="noResults">⚠️ Không tìm thấy Kanji nào</div>
    </div>

    <!-- ═══ LEARN SCREEN ═══ -->
    <div id="learn-screen">
        <div class="nav-top">
            <div class="nav-group">
                <button class="btn-nav btn-back" onclick="goHome()">←戻る</button>
                <button class="btn-nav btn-prev-next" onclick="prevKanji()">←前</button>
            </div>
            <h2 id="current-title">一</h2>
            <div class="nav-group">
                <button class="btn-nav btn-prev-next" onclick="nextKanji()">次→</button>
                <div class="nav-search">
                    <input type="text" id="learnSearch" placeholder="🔍 Tìm kanji..." autocomplete="off">
                    <button class="goto-btn" id="gotoBtn" disabled>Đến</button>
                </div>
                <button class="btn-nav btn-clear" onclick="clearBoard()">消す</button>
            </div>
        </div>

        <div class="main-view">
            <div class="left-panel">
                <div class="left-top">
                    <div class="gif-wrap">
                        <img id="kanji-gif" src="" alt="GIF" onerror="this.style.display='none'">
                    </div>
                </div>

                <div class="left-bottom">
                    <div class="reading-area" id="readingArea">
                        <div class="reading-line">
                            <span class="label">ON</span>
                            <span class="value" id="onReading">?</span>
                        </div>
                        <div class="reading-line">
                            <span class="label">KUN</span>
                            <span class="value" id="kunReading">?</span>
                        </div>
                        <div class="reading-line">
                            <span class="label stroke-display">画</span>
                            <span class="value stroke-display" id="strokeDisplay">5</span>
                        </div>
                    </div>

                    <div class="vocab-area">
                        <div class="vocab-title">📖 Từ vựng (tự tạo)</div>
                        <div class="vocab-table-wrap">
                            <table class="vocab-table">
                                <thead>
                                    <tr><th>Kanji</th><th>Đọc</th><th>Nghĩa</th></tr>
                                </thead>
                                <tbody id="vocabBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div class="canvas-container">
                    <div id="trace-text"></div>
                    <canvas id="canvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── DANH SÁCH KANJI MỚI ──────────────────────────────────────────
            var rawKanjiList = [
                "刀", "丸", "弓", "工", "才", "万", "引", "牛", "今", "元",
                "戸", "午", "公", "止", "少", "心", "切", "太", "内", "父",
                "分", "方", "毛", "友", "外", "兄", "古", "広", "矢", "市",
                "台", "冬", "半", "母", "北", "用", "羽", "会", "回", "交",
                "光", "考", "行", "合", "寺", "自", "色", "西", "多", "池",
                "地", "当", "同", "肉", "米", "毎", "何", "角", "汽", "近",
                "形", "言", "谷", "作", "社", "図", "声", "走", "体", "弟",
                "売", "麦", "来", "里", "画", "岩", "京", "国", "姉", "知",
                "長", "直", "店", "東", "歩", "妹", "明", "門", "夜", "科",
                "海", "活", "計", "後", "室", "首", "秋", "春", "食", "星",
                "前", "茶", "昼", "点", "南", "風", "思", "家", "夏", "記",
                "帰", "原", "高", "紙", "時", "弱", "書", "通", "馬", "魚",
                "教", "強", "黄", "黒", "細", "週", "雪", "船", "組", "鳥",
                "野", "理", "雲", "絵", "間", "場", "晴", "朝", "答", "道",
                "買", "番", "遠", "園", "楽", "新", "数", "電", "話", "歌",
                "語", "算", "読", "聞", "鳴", "線", "親", "頭", "顔", "曜"
            ];

            // ─── TỰ ĐỘNG TẠO DỮ LIỆU CHO TỪNG KANJI ──────────────────────────
            var kanjiDetails = {};
            var strokeCounts = {};

            // Hàm tạo từ vựng giả (tự động)
            function generateVocab(kanji) {
                var suffixes = [
                    ["さん", "san", "ông/bà"],
                    ["しゃ", "sha", "công ty"],
                    ["じゅう", "juu", "mười"],
                    ["かい", "kai", "hội"],
                    ["ど", "do", "độ"]
                ];
                var vocab = [];
                suffixes.forEach(function(suf) {
                    var compound = kanji + suf[0];
                    var reading = kanji + suf[1]; // giả định đọc đơn giản
                    var meaning = kanji + suf[2]; // tạm
                    vocab.push([compound, reading, meaning]);
                });
                return vocab;
            }

            // Tạo dữ liệu cho từng kanji
            rawKanjiList.forEach(function(k) {
                // On, Kun mặc định
                kanjiDetails[k] = {
                    on: "?",
                    kun: "?",
                    vocab: generateVocab(k)
                };
                // Số nét mặc định 5 (có thể thay đổi sau)
                strokeCounts[k] = 5;
            });

            // ─── SẮP XẾP (giữ nguyên thứ tự ban đầu) ──────────────────────────
            var kanjiData = rawKanjiList.slice(); // không sắp xếp

            // ─── BIẾN TOÀN CỤC ──────────────────────────────────────────
            var canvas, ctx, trace, title, home, learn;
            var onReading, kunReading, strokeDisplay, vocabBody;
            var gifImg;
            var drawing = false;
            var currentIndex = 0;

            // ─── DOM REFS SEARCH ──────────────────────────────────────
            var homeSearch = document.getElementById('homeSearch');
            var clearSearchBtn = document.getElementById('clearSearchBtn');
            var noResults = document.getElementById('noResults');
            var learnSearch = document.getElementById('learnSearch');
            var gotoBtn = document.getElementById('gotoBtn');

            // ─── KHỞI TẠO ──────────────────────────────────────────────
            function init() {
                home = document.getElementById('home-screen');
                learn = document.getElementById('learn-screen');
                canvas = document.getElementById('canvas');
                ctx = canvas.getContext('2d');
                trace = document.getElementById('trace-text');
                title = document.getElementById('current-title');
                gifImg = document.getElementById('kanji-gif');

                onReading = document.getElementById('onReading');
                kunReading = document.getElementById('kunReading');
                strokeDisplay = document.getElementById('strokeDisplay');
                vocabBody = document.getElementById('vocabBody');

                renderGrid(kanjiData);

                homeSearch.addEventListener('input', function() {
                    filterGrid(this.value.trim());
                });

                clearSearchBtn.addEventListener('click', function() {
                    homeSearch.value = '';
                    filterGrid('');
                    homeSearch.focus();
                });

                learnSearch.addEventListener('input', function() {
                    var val = this.value.trim();
                    if (val.length === 0) {
                        gotoBtn.disabled = true;
                        gotoBtn.textContent = 'Đến';
                        return;
                    }
                    var match = findKanjiByTerm(val);
                    if (match) {
                        gotoBtn.disabled = false;
                        gotoBtn.textContent = '🔍 ' + match;
                    } else {
                        gotoBtn.disabled = true;
                        gotoBtn.textContent = 'Đến';
                    }
                });

                learnSearch.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !gotoBtn.disabled) {
                        gotoBtn.click();
                    }
                });

                gotoBtn.addEventListener('click', function() {
                    if (this.disabled) return;
                    var target = this.textContent.replace('🔍 ', '').trim();
                    if (target && kanjiData.includes(target)) {
                        var idx = kanjiData.indexOf(target);
                        if (idx !== -1) {
                            currentIndex = idx;
                            updateLearnScreen(kanjiData[currentIndex]);
                            learnSearch.value = '';
                            gotoBtn.disabled = true;
                            gotoBtn.textContent = 'Đến';
                        }
                    }
                });

                canvas.addEventListener('mousedown', startDrawing);
                canvas.addEventListener('mousemove', draw);
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('mouseleave', stopDrawing);
                canvas.addEventListener('touchstart', startDrawing, { passive: false });
                canvas.addEventListener('touchmove', draw, { passive: false });
                canvas.addEventListener('touchend', stopDrawing);
                canvas.addEventListener('touchcancel', stopDrawing);

                window.addEventListener('resize', function() {
                    requestAnimationFrame(resizeCanvas);
                });
                window.addEventListener('orientationchange', function() {
                    setTimeout(function() { requestAnimationFrame(resizeCanvas); }, 100);
                });
            }

            // ─── RENDER GRID ──────────────────────────────────────────
            function renderGrid(list) {
                var grid = document.getElementById('kanjiGrid');
                grid.innerHTML = '';
                var fragment = document.createDocumentFragment();
                for (var i = 0; i < list.length; i++) {
                    var k = list[i];
                    var div = document.createElement('div');
                    div.className = 'card-kanji';
                    div.innerText = k;
                    div.dataset.kanji = k;
                    div.onclick = (function(kanji) {
                        return function() { startLearn(kanji); };
                    })(k);
                    fragment.appendChild(div);
                }
                grid.appendChild(fragment);
                noResults.classList.remove('visible');
            }

            // ─── FILTER GRID ──────────────────────────────────────────
            function filterGrid(term) {
                if (!term) {
                    var allCards = document.querySelectorAll('.card-kanji');
                    allCards.forEach(function(c) { c.classList.remove('hidden'); });
                    noResults.classList.remove('visible');
                    clearSearchBtn.classList.remove('visible');
                    return;
                }

                clearSearchBtn.classList.add('visible');
                var lower = term.toLowerCase();
                var matched = [];
                var cards = document.querySelectorAll('.card-kanji');

                cards.forEach(function(card) {
                    var k = card.dataset.kanji;
                    var detail = kanjiDetails[k];
                    var on = (detail && detail.on) ? detail.on : '';
                    var kun = (detail && detail.kun) ? detail.kun : '';
                    var match = false;

                    if (k.includes(term)) match = true;
                    if (on.toLowerCase().includes(lower)) match = true;
                    if (kun.toLowerCase().includes(lower)) match = true;

                    if (match) {
                        card.classList.remove('hidden');
                        matched.push(k);
                    } else {
                        card.classList.add('hidden');
                    }
                });

                if (matched.length === 0) {
                    noResults.classList.add('visible');
                } else {
                    noResults.classList.remove('visible');
                }
            }

            // ─── TÌM KANJI THEO TỪ KHÓA ──────────────────────────────
            function findKanjiByTerm(term) {
                if (!term) return null;
                var lower = term.toLowerCase().trim();
                var candidates = [];

                for (var i = 0; i < kanjiData.length; i++) {
                    var k = kanjiData[i];
                    var detail = kanjiDetails[k];
                    var on = (detail && detail.on) ? detail.on : '';
                    var kun = (detail && detail.kun) ? detail.kun : '';
                    var score = 0;

                    if (k === term) return k;
                    if (k.includes(term)) score += 100;
                    if (on.toLowerCase().includes(lower)) score += 50;
                    if (kun.toLowerCase().includes(lower)) score += 50;

                    if (score > 0) {
                        candidates.push({ kanji: k, score: score });
                    }
                }

                if (candidates.length === 0) return null;
                candidates.sort(function(a, b) { return b.score - a.score; });
                return candidates[0].kanji;
            }

            // ─── UPDATE LEARN SCREEN ──────────────────────────────────
            function updateLearnScreen(k) {
                var detail = kanjiDetails[k];
                if (!detail) {
                    detail = { on: '?', kun: '?', vocab: [] };
                }
                var strokes = strokeCounts[k] || 5;

                title.innerText = k + '（' + (detail.kun || '') + '）';
                onReading.textContent = detail.on || '?';
                kunReading.textContent = detail.kun || '?';
                strokeDisplay.textContent = strokes;

                // GIF: tên file theo kanji (có thể không có, sẽ hiển thị lỗi)
                gifImg.src = k + '-order.gif';
                gifImg.style.display = '';

                trace.textContent = k;

                var vocab = detail.vocab || [];
                vocabBody.innerHTML = '';
                if (vocab.length === 0) {
                    var row = document.createElement('tr');
                    var cell = document.createElement('td');
                    cell.colSpan = 3;
                    cell.style.textAlign = 'center';
                    cell.style.color = '#a0aec0';
                    cell.style.padding = '16px 0';
                    cell.textContent = 'Chưa có dữ liệu từ vựng';
                    row.appendChild(cell);
                    vocabBody.appendChild(row);
                } else {
                    vocab.forEach(function(item) {
                        var tr = document.createElement('tr');
                        tr.innerHTML = '<td class="kanji-col">' + item[0] + '</td>' +
                            '<td class="reading-col">' + item[1] + '</td>' +
                            '<td class="meaning-col">' + item[2] + '</td>';
                        vocabBody.appendChild(tr);
                    });
                }

                clearBoard();
                requestAnimationFrame(function() {
                    setTimeout(resizeCanvas, 50);
                });
            }

            // ─── NAVIGATION ──────────────────────────────────────────
            function startLearn(k) {
                home.style.display = 'none';
                learn.style.display = 'flex';
                currentIndex = kanjiData.indexOf(k);
                if (currentIndex === -1) currentIndex = 0;
                updateLearnScreen(k);
                learnSearch.value = '';
                gotoBtn.disabled = true;
                gotoBtn.textContent = 'Đến';
            }

            window.prevKanji = function() {
                if (currentIndex > 0) {
                    currentIndex--;
                    updateLearnScreen(kanjiData[currentIndex]);
                    learnSearch.value = '';
                    gotoBtn.disabled = true;
                    gotoBtn.textContent = 'Đến';
                }
            };
            window.nextKanji = function() {
                if (currentIndex < kanjiData.length - 1) {
                    currentIndex++;
                    updateLearnScreen(kanjiData[currentIndex]);
                    learnSearch.value = '';
                    gotoBtn.disabled = true;
                    gotoBtn.textContent = 'Đến';
                }
            };
            window.goHome = function() {
                home.style.display = 'flex';
                learn.style.display = 'none';
                gifImg.src = '';
                learnSearch.value = '';
                gotoBtn.disabled = true;
                gotoBtn.textContent = 'Đến';
            };
            window.clearBoard = function() {
                if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            // ─── CANVAS ──────────────────────────────────────────────
            function resizeCanvas() {
                if (!canvas || !canvas.parentElement) return;
                var container = canvas.parentElement;
                var w = container.clientWidth;
                var h = container.clientHeight;
                canvas.width = w;
                canvas.height = h;
                clearBoard();
            }

            function getPos(e) {
                var rect = canvas.getBoundingClientRect();
                var scaleX = canvas.width / rect.width;
                var scaleY = canvas.height / rect.height;
                var clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                var x = (clientX - rect.left) * scaleX;
                var y = (clientY - rect.top) * scaleY;
                x = Math.min(Math.max(x, 0), canvas.width);
                y = Math.min(Math.max(y, 0), canvas.height);
                return { x: x, y: y };
            }

            function startDrawing(e) {
                if (e.preventDefault) e.preventDefault();
                drawing = true;
                ctx.beginPath();
                draw(e);
            }

            function stopDrawing() {
                drawing = false;
                ctx.beginPath();
            }

            function draw(e) {
                if (!drawing) return;
                if (e.preventDefault) e.preventDefault();
                var p = getPos(e);
                ctx.lineWidth = Math.max(8, canvas.width / 40);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = '#2d3436';
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
            }

            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>
</body>
</html>
