<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kanji Lớp 1">
    <title>Kanji Lớp 1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">

    <style>
        /* ... (giữ nguyên CSS như lần trước, tôi không thay đổi) ... */
        :root {
            --danger: #d63031;
            --bg: #ffffff;
            --header-bg: #f8f9fa;
            --border: #ddd;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, sans-serif;
            background: var(--bg);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #home-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom) 15px;
            overflow-y: auto;
        }
        .home-header {
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
            padding: 12px 0 8px 0;
        }
        .home-header h2 {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #2d3436;
            margin-bottom: 8px;
        }
        .search-wrap {
            position: relative;
            width: 100%;
        }
        .search-wrap input {
            width: 100%;
            padding: 12px 44px 12px 18px;
            font-size: 16px;
            border: 2px solid var(--border);
            border-radius: 14px;
            outline: none;
            background: #fafafa;
            transition: border-color 0.25s, box-shadow 0.25s;
            color: #2d3436;
        }
        .search-wrap input:focus {
            border-color: #666;
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.04);
            background: white;
        }
        .search-wrap input::placeholder {
            color: #aaa;
            font-weight: 400;
        }
        .search-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 20px;
            color: #bbb;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 50%;
            display: none;
            transition: color 0.2s;
        }
        .search-clear:active {
            color: #555;
        }
        .search-clear.visible {
            display: block;
        }
        .search-stats {
            font-size: 13px;
            color: #888;
            text-align: center;
            padding: 4px 0 6px 0;
            min-height: 24px;
        }
        .search-stats em {
            font-style: normal;
            font-weight: 600;
            color: #2d3436;
        }
        .grid-kanji {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 12px;
            padding: 8px 0 50px 0;
            flex: 1;
            align-content: start;
        }
        .card-kanji {
            aspect-ratio: 1/1;
            border: 1.5px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            cursor: pointer;
            background: white;
            transition: 0.2s;
            padding: 4px;
            line-height: 1.2;
            text-align: center;
            user-select: none;
        }
        .card-kanji:active {
            background: #f0f0f0;
            transform: scale(0.96);
        }
        .card-kanji .kanji-only {
            font-size: clamp(24px, 7vw, 34px);
            font-weight: 600;
        }
        .card-kanji .reading-sm {
            font-size: 10px;
            font-weight: 400;
            color: #666;
            margin-top: 1px;
            letter-spacing: 0.3px;
            line-height: 1.2;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .card-kanji.saved {
            border-color: #2d7d46;
            border-width: 3px;
            background-color: #f0fff0;
        }
        @media (max-width: 400px) {
            .card-kanji .kanji-only {
                font-size: 6.5vw;
            }
        }
        @media (max-width: 300px) {
            .card-kanji .kanji-only {
                font-size: 5vw;
            }
        }
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #aaa;
            font-size: 16px;
            font-weight: 500;
        }
        .no-results span {
            display: block;
            font-size: 40px;
            margin-bottom: 12px;
        }
        #learn-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: white;
            display: none;
            flex-direction: column;
            z-index: 100;
        }
        .nav-top {
            padding: 10px 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
            background: var(--header-bg);
            padding-top: max(10px, env(safe-area-inset-top));
            padding-left: max(15px, env(safe-area-inset-left));
            padding-right: max(15px, env(safe-area-inset-right));
        }
        .nav-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn-nav {
            padding: 8px 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            background: #eee;
            color: #333;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        .btn-nav:active {
            opacity: 0.7;
        }
        .btn-back {
            background: #e0e0e0;
        }
        .btn-clear {
            background: var(--danger);
            color: white;
        }
        .btn-prev-next {
            background: #ffffff;
            border: 1px solid #aaa;
        }
        .btn-save {
            background: #2980b9;
            color: white;
        }
        .btn-pdf {
            background: #2d7d46;
            color: white;
        }
        .btn-clear-collection {
            background: #e67e22;
            color: white;
        }
        #current-title {
            font-size: 18px;
            margin: 0 5px;
            text-align: center;
            flex: 0 1 auto;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 40%;
        }
        .main-view {
            flex: 1;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .main-view .left-col {
            flex: 2;
            display: flex;
            flex-direction: column;
            padding: 10px;
            overflow-y: auto;
            border-right: 1px solid #eee;
        }
        .main-view .right-col {
            flex: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            position: relative;
        }
        #kanji-gif {
            max-width: 100%;
            max-height: 150px;
            object-fit: contain;
            border-radius: 8px;
            display: block;
            margin-bottom: 8px;
        }
        .vocab-section {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }
        .vocab-section h3 {
            font-size: 16px;
            margin: 4px 0 8px 0;
            color: #2d3436;
            border-bottom: 2px solid #eee;
            padding-bottom: 4px;
        }
        .vocab-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .vocab-table th {
            background: #f0f0f0;
            padding: 6px 4px;
            text-align: left;
            font-weight: 600;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .vocab-table td {
            padding: 6px 4px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: top;
        }
        .vocab-table .word {
            font-weight: 600;
            font-size: 1.05em;
        }
        .vocab-table .reading {
            color: #666;
            font-size: 0.9em;
        }
        .vocab-table .meaning {
            color: #2d7d46;
            font-weight: 500;
        }
        .vocab-table tr:last-child td {
            border-bottom: none;
        }
        .info-row {
            display: flex;
            gap: 12px;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .info-row span {
            background: #f5f5f5;
            padding: 2px 10px;
            border-radius: 12px;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            container-type: size;
        }
        canvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            display: block;
            background-image: linear-gradient(#f0f0f0 1px, transparent 1px),
                linear-gradient(90deg, #f0f0f0 1px, transparent 1px);
            background-size: 20% 20%;
        }
        #trace-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(0, 0, 0, 0.05);
            pointer-events: none;
            white-space: nowrap;
            line-height: 1;
            font-size: 40vw;
        }
        @container (min-width: 1px) {
            #trace-text {
                font-size: min(70cqi, 70cqh);
            }
        }
        @media (max-aspect-ratio: 1/1) {
            .main-view {
                flex-direction: column;
            }
            .main-view .left-col {
                flex: 0 0 40%;
                border-right: none;
                border-bottom: 1px solid #eee;
                padding: 6px 10px;
                overflow-y: auto;
            }
            .main-view .right-col {
                flex: 1;
            }
            #kanji-gif {
                max-height: 100px;
            }
            .vocab-table {
                font-size: 13px;
            }
            .vocab-table th,
            .vocab-table td {
                padding: 4px 2px;
            }
        }
        @media (max-width: 480px) {
            .grid-kanji {
                grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
                gap: 10px;
            }
            .card-kanji .kanji-only {
                font-size: clamp(20px, 6vw, 28px);
            }
            .card-kanji .reading-sm {
                font-size: 9px;
            }
            .search-wrap input {
                font-size: 15px;
                padding: 10px 40px 10px 14px;
            }
            .home-header h2 {
                font-size: 19px;
            }
        }
        @media (max-width: 380px) {
            .grid-kanji {
                grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
                gap: 8px;
            }
            .card-kanji .kanji-only {
                font-size: clamp(16px, 5vw, 22px);
            }
            .card-kanji .reading-sm {
                font-size: 7px;
            }
        }
    </style>
</head>
<body>

    <div id="home-screen">
        <div class="home-header">
            <h2>📖 1年生 ８０漢字</h2>
            <div class="search-wrap">
                <input type="text" id="searchInput" placeholder="🔍 Tìm theo âm đọc (いち), Romaji (ichi), hoặc chữ Hán (一)" autocomplete="off" spellcheck="false">
                <button class="search-clear" id="searchClear" aria-label="Xóa tìm kiếm">✕</button>
            </div>
            <div class="search-stats" id="searchStats">Tổng số <em>80</em> Kanji</div>
        </div>
        <div class="grid-kanji" id="kanjiGrid"></div>
    </div>

    <div id="learn-screen">
        <div class="nav-top">
            <div class="nav-group">
                <button class="btn-nav btn-back" onclick="goHome()">←戻る</button>
                <button class="btn-nav btn-prev-next" onclick="prevKanji()">←前</button>
            </div>
            <h2 id="current-title">一</h2>
            <div class="nav-group">
                <button class="btn-nav btn-prev-next" onclick="nextKanji()">次→</button>
                <button class="btn-nav btn-clear" onclick="clearBoard()">消す</button>
                <button class="btn-nav btn-save" onclick="saveCurrent()">📥 Lưu</button>
                <button class="btn-nav btn-pdf" onclick="exportPDF()">📄 PDF</button>
                <button class="btn-nav btn-clear-collection" onclick="clearCollection()">🗑️ Xóa</button>
            </div>
        </div>

        <div class="main-view">
            <!-- Cột trái: GIF + từ vựng -->
            <div class="left-col" id="leftCol">
                <img id="kanji-gif" src="" alt="GIF" onerror="this.style.display='none'">
                <div class="info-row" id="infoRow">
                    <span id="onReading">ON: </span>
                    <span id="kunReading">KUN: </span>
                    <span id="strokeCount">画: </span>
                </div>
                <div class="vocab-section" id="vocabSection">
                    <h3>📚 Từ vựng gợi ý</h3>
                    <table class="vocab-table" id="vocabTable">
                        <thead><tr><th>Từ</th><th>Đọc</th><th>Nghĩa</th></tr></thead>
                        <tbody id="vocabBody"></tbody>
                    </table>
                </div>
            </div>
            <!-- Cột phải: canvas vẽ -->
            <div class="right-col">
                <div class="canvas-container">
                    <div id="trace-text"></div>
                    <canvas id="canvas"></canvas>
                </div>
            </div>
        </div>
    </div>

            // ---- HÀM LẤY DỮ LIỆU TỪ VỰNG ----
            function getVocab(kanji) {
                var def = vocabData[kanji];
                if (!def) {
                    var on = readings[kanji] ? readings[kanji].toUpperCase() : "?";
                    var kun = readings[kanji] || "?";
                    return {
                        on: on,
                        kun: kun,
                        words: [
                            { word: kanji, reading: readings[kanji] || "", meaning: "（chưa có dữ liệu）" }
                        ]
                    };
                }
                return def;
            }

            // ---- SẮP XẾP KANJI THEO SỐ NÉT ----
            var kanjiData = rawKanjiList.slice();
            kanjiData.sort(function(a, b) {
                return strokeCounts[a] - strokeCounts[b];
            });

            // ---- BIẾN TOÀN CỤC ----
            var canvas, ctx, gif, trace, title, home, learn, grid, searchInput, searchClear, searchStats;
            var onReading, kunReading, strokeCount, vocabBody;
            var drawing = false;
            var currentIndex = 0;
            var currentFilter = '';
            var currentKanji = '';
            var savedMap = {};

            // ---- KHỞI TẠO ----
            function init() {
                home = document.getElementById('home-screen');
                learn = document.getElementById('learn-screen');
                canvas = document.getElementById('canvas');
                ctx = canvas.getContext('2d');
                gif = document.getElementById('kanji-gif');
                trace = document.getElementById('trace-text');
                title = document.getElementById('current-title');
                grid = document.getElementById('kanjiGrid');
                searchInput = document.getElementById('searchInput');
                searchClear = document.getElementById('searchClear');
                searchStats = document.getElementById('searchStats');
                onReading = document.getElementById('onReading');
                kunReading = document.getElementById('kunReading');
                strokeCount = document.getElementById('strokeCount');
                vocabBody = document.getElementById('vocabBody');

                loadSaved();
                renderGrid();

                canvas.addEventListener('mousedown', startDrawing);
                canvas.addEventListener('mousemove', draw);
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('mouseleave', stopDrawing);
                canvas.addEventListener('touchstart', startDrawing, { passive: false });
                canvas.addEventListener('touchmove', draw, { passive: false });
                canvas.addEventListener('touchend', stopDrawing);
                canvas.addEventListener('touchcancel', stopDrawing);

                window.addEventListener('resize', function() {
                    requestAnimationFrame(resizeCanvas);
                });
                window.addEventListener('orientationchange', function() {
                    setTimeout(function() { requestAnimationFrame(resizeCanvas); }, 100);
                });

                searchInput.addEventListener('input', onSearchInput);
                searchClear.addEventListener('click', clearSearch);
                searchInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') {
                        clearSearch();
                        searchInput.blur();
                    }
                });
            }

            // ---- LƯU / TẢI DỮ LIỆU ----
            function saveSaved() {
                try {
                    var data = JSON.stringify(savedMap);
                    localStorage.setItem('kanji_saved', data);
                } catch (e) {}
            }

            function loadSaved() {
                try {
                    var data = localStorage.getItem('kanji_saved');
                    if (data) {
                        savedMap = JSON.parse(data);
                        for (var key in savedMap) {
                            if (kanjiData.indexOf(key) === -1) {
                                delete savedMap[key];
                            }
                        }
                    }
                } catch (e) {}
            }

            // ---- TÌM KIẾM ----
            function onSearchInput() {
                var q = searchInput.value;
                currentFilter = q;
                searchClear.classList.toggle('visible', q.length > 0);
                renderGrid();
            }

            function clearSearch() {
                searchInput.value = '';
                currentFilter = '';
                searchClear.classList.remove('visible');
                renderGrid();
                searchInput.focus();
            }

            function filterKanji(query) {
                var trimmed = query.trim();
                if (!trimmed) return kanjiData;
                var q = trimmed.toLowerCase();
                var hasKanji = /[\u4e00-\u9faf]/.test(q);
                var results = [];
                for (var i = 0; i < kanjiData.length; i++) {
                    var k = kanjiData[i];
                    var reading = readings[k] || '';
                    var romaji = kanaToRomaji(reading).toLowerCase();
                    var matchKanji = k.includes(q);
                    var matchReading = reading.includes(q);
                    var matchRomaji = romaji.includes(q);
                    if (hasKanji) {
                        if (matchKanji) results.push(k);
                    } else {
                        if (matchKanji || matchReading || matchRomaji) {
                            results.push(k);
                        }
                    }
                }
                return results;
            }

            // ---- RENDER GRID ----
            function renderGrid() {
                var filtered = filterKanji(currentFilter);
                var total = kanjiData.length;
                var found = filtered.length;

                if (currentFilter.trim()) {
                    searchStats.innerHTML = '🔍 Tìm thấy <em>' + found + '</em> / ' + total + ' Kanji';
                } else {
                    searchStats.innerHTML = 'Tổng số <em>' + total + '</em> Kanji';
                }

                grid.innerHTML = '';

                if (found === 0) {
                    var empty = document.createElement('div');
                    empty.className = 'no-results';
                    empty.innerHTML = '<span>🔎</span> Không tìm thấy Kanji nào cho “' + currentFilter.trim() + '”';
                    grid.appendChild(empty);
                    return;
                }

                var isSearching = currentFilter.trim().length > 0;

                for (var i = 0; i < filtered.length; i++) {
                    var k = filtered[i];
                    var card = document.createElement('div');
                    card.className = 'card-kanji';
                    if (savedMap[k]) {
                        card.classList.add('saved');
                    }
                    card.dataset.kanji = k;

                    var kanjiSpan = document.createElement('span');
                    kanjiSpan.className = 'kanji-only';
                    kanjiSpan.textContent = k;
                    card.appendChild(kanjiSpan);

                    if (isSearching) {
                        var reading = readings[k] || '';
                        if (reading) {
                            var readingSpan = document.createElement('span');
                            readingSpan.className = 'reading-sm';
                            readingSpan.textContent = reading;
                            card.appendChild(readingSpan);
                        }
                    }

                    card.onclick = (function(kanji) {
                        return function() { startLearn(kanji); };
                    })(k);

                    grid.appendChild(card);
                }
            }

            // ---- HIỂN THỊ TỪ VỰNG ----
            function renderVocab(kanji) {
                var data = getVocab(kanji);
                onReading.textContent = 'ON: ' + data.on;
                kunReading.textContent = 'KUN: ' + data.kun;
                strokeCount.textContent = '画: ' + (strokeCounts[kanji] || '?');

                var html = '';
                var words = data.words || [];
                if (words.length === 0) {
                    html = '<tr><td colspan="3" style="text-align:center;color:#aaa;">Chưa có từ vựng</td></tr>';
                } else {
                    for (var i = 0; i < words.length; i++) {
                        var w = words[i];
                        html += '<tr>' +
                            '<td class="word">' + w.word + '</td>' +
                            '<td class="reading">' + w.reading + '</td>' +
                            '<td class="meaning">' + w.meaning + '</td>' +
                            '</tr>';
                    }
                }
                vocabBody.innerHTML = html;
            }

            // ---- HỌC KANJI ----
            function updateLearnScreen(k) {
                currentKanji = k;
                var reading = readings[k] || '';
                title.innerText = k + (reading ? ' (' + reading + ')' : '');
                trace.innerText = k;
                gif.src = k + '-order.gif';
                gif.style.display = '';
                clearBoard();
                renderVocab(k);
                requestAnimationFrame(function() {
                    setTimeout(resizeCanvas, 50);
                });
            }

            function startLearn(k) {
                if (currentKanji && currentKanji !== k) {
                    saveCurrent();
                }
                home.style.display = 'none';
                learn.style.display = 'flex';
                currentIndex = kanjiData.indexOf(k);
                if (currentIndex === -1) currentIndex = 0;
                updateLearnScreen(k);
            }

            window.prevKanji = function() {
                if (currentIndex > 0) {
                    saveCurrent();
                    currentIndex--;
                    updateLearnScreen(kanjiData[currentIndex]);
                }
            };

            window.nextKanji = function() {
                if (currentIndex < kanjiData.length - 1) {
                    saveCurrent();
                    currentIndex++;
                    updateLearnScreen(kanjiData[currentIndex]);
                }
            };

            window.goHome = function() {
                if (currentKanji) {
                    saveCurrent();
                }
                home.style.display = 'flex';
                learn.style.display = 'none';
                gif.src = '';
                renderGrid();
            };

            window.clearBoard = function() {
                if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            window.saveCurrent = function() {
                if (!currentKanji) return;
                var imgData = canvas.toDataURL('image/png');
                savedMap[currentKanji] = imgData;
                saveSaved();
                renderGrid();
            };

            window.clearCollection = function() {
                if (Object.keys(savedMap).length === 0) return;
                if (confirm('Bạn có chắc muốn xóa tất cả các chữ đã lưu?')) {
                    savedMap = {};
                    saveSaved();
                    renderGrid();
                }
            };

            // ---- XUẤT PDF ----
            window.exportPDF = function() {
                var keys = Object.keys(savedMap);
                if (keys.length === 0) {
                    alert('Bạn chưa lưu chữ nào! Hãy vẽ và nhấn "Lưu" hoặc dùng nút "次" để tự động lưu.');
                    return;
                }
                keys.sort(function(a, b) {
                    return kanjiData.indexOf(a) - kanjiData.indexOf(b);
                });

                var { jsPDF } = window.jspdf;
                var pdf = new jsPDF('l', 'mm', 'a4');
                var pageWidth = pdf.internal.pageSize.getWidth();
                var pageHeight = pdf.internal.pageSize.getHeight();

                var margin = 10;
                var cols = 5;
                var rowsPerPage = 4;
                var maxCellsPerPage = cols * rowsPerPage;
                var totalPages = Math.ceil(keys.length / maxCellsPerPage);

                var cellWidth = (pageWidth - 2 * margin) / cols;
                var cellHeight = (pageHeight - 2 * margin - 15) / rowsPerPage;

                for (var page = 0; page < totalPages; page++) {
                    if (page > 0) pdf.addPage();

                    pdf.setFontSize(0);
                    pdf.text('Kanji Lớp 1 (Trang ' + (page + 1) + '/' + totalPages + ')', pageWidth / 2, 12, { align: 'center' });

                    var startIdx = page * maxCellsPerPage;
                    var endIdx = Math.min(startIdx + maxCellsPerPage, keys.length);

                    for (var i = startIdx; i < endIdx; i++) {
                        var ch = keys[i];
                        var reading = readings[ch] || '';
                        var idx = i - startIdx;
                        var row = Math.floor(idx / cols);
                        var col = idx % cols;

                        var x = margin + col * cellWidth;
                        var y = margin + row * cellHeight + 14;

                        pdf.setDrawColor(150);
                        pdf.setLineWidth(0.5);
                        pdf.rect(x, y, cellWidth, cellHeight, 'S');

                        pdf.setFontSize(0);
                        pdf.text(ch + ' (' + reading + ')', x + 2, y + 4);

                        var imgData = savedMap[ch];
                        if (imgData) {
                            var maxImgWidth = cellWidth - 6;
                            var maxImgHeight = cellHeight - 16;
                            var img = new Image();
                            img.src = imgData;

                            var imgW, imgH;
                            if (img.complete) {
                                var ratio = Math.min(maxImgWidth / img.width, maxImgHeight / img.height);
                                imgW = img.width * ratio;
                                imgH = img.height * ratio;
                            } else {
                                imgW = maxImgWidth * 0.8;
                                imgH = maxImgHeight * 0.8;
                            }

                            var posX = x + (cellWidth - imgW) / 2;
                            var posY = y + 12 + (cellHeight - 12 - imgH) / 2;

                            try {
                                pdf.addImage(imgData, 'PNG', posX, posY, imgW, imgH);
                            } catch (e) {
                                console.log('Lỗi chèn ảnh cho ' + ch);
                            }
                        }
                    }
                }

                pdf.save('Kanji_Lop1_da_luu.pdf');
            };

            // ---- VẼ ----
            function resizeCanvas() {
                if (!canvas || !canvas.parentElement) return;
                var container = canvas.parentElement;
                var w = container.clientWidth;
                var h = container.clientHeight;
                canvas.width = w;
                canvas.height = h;
                clearBoard();
            }

            function getPos(e) {
                var rect = canvas.getBoundingClientRect();
                var scaleX = canvas.width / rect.width;
                var scaleY = canvas.height / rect.height;
                var clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                var x = (clientX - rect.left) * scaleX;
                var y = (clientY - rect.top) * scaleY;
                x = Math.min(Math.max(x, 0), canvas.width);
                y = Math.min(Math.max(y, 0), canvas.height);
                return { x: x, y: y };
            }

            function startDrawing(e) {
                if (e.preventDefault) e.preventDefault();
                drawing = true;
                ctx.beginPath();
                draw(e);
            }

            function stopDrawing() {
                drawing = false;
                ctx.beginPath();
            }

            function draw(e) {
                if (!drawing) return;
                if (e.preventDefault) e.preventDefault();
                var p = getPos(e);
                ctx.lineWidth = Math.max(8, canvas.width / 40);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = '#2d3436';
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
            }

            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>
</body>
</html>
