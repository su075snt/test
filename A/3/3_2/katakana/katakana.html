<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Katakana Tập Vẽ">
    <title>Katakana Tập Vẽ</title>
    <style>
        :root {
            --danger: #d63031;
            --bg: #ffffff;
            --header-bg: #f8f9fa;
            --border: #ddd;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, sans-serif;
            background: var(--bg);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #home-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom) 15px;
            overflow-y: auto;
        }

        .home-header {
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
            padding: 12px 0 8px 0;
        }
        .home-header h2 {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #2d3436;
            margin-bottom: 8px;
        }

        .search-wrap {
            position: relative;
            width: 100%;
        }
        .search-wrap input {
            width: 100%;
            padding: 12px 44px 12px 18px;
            font-size: 16px;
            border: 2px solid var(--border);
            border-radius: 14px;
            outline: none;
            background: #fafafa;
            transition: border-color 0.25s, box-shadow 0.25s;
            color: #2d3436;
        }
        .search-wrap input:focus {
            border-color: #666;
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.04);
            background: white;
        }
        .search-wrap input::placeholder {
            color: #aaa;
            font-weight: 400;
        }
        .search-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 20px;
            color: #bbb;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 50%;
            display: none;
            transition: color 0.2s;
        }
        .search-clear:active {
            color: #555;
        }
        .search-clear.visible {
            display: block;
        }

        .search-stats {
            font-size: 13px;
            color: #888;
            text-align: center;
            padding: 4px 0 6px 0;
            min-height: 24px;
        }
        .search-stats em {
            font-style: normal;
            font-weight: 600;
            color: #2d3436;
        }

        .grid-kanji {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 12px;
            padding: 8px 0 50px 0;
            flex: 1;
            align-content: start;
        }

        .card-kanji {
            aspect-ratio: 1/1;
            border: 1.5px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            cursor: pointer;
            background: white;
            transition: 0.2s;
            padding: 4px;
            line-height: 1.2;
            text-align: center;
            user-select: none;
        }
        .card-kanji:active {
            background: #f0f0f0;
            transform: scale(0.96);
        }

        .card-kanji .kanji-only {
            font-size: clamp(28px, 8vw, 38px);
            font-weight: 600;
        }
        .card-kanji .reading-sm {
            font-size: 10px;
            font-weight: 400;
            color: #666;
            margin-top: 1px;
            letter-spacing: 0.3px;
            line-height: 1.2;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (max-width: 400px) {
            .card-kanji .kanji-only {
                font-size: 7vw;
            }
        }
        @media (max-width: 300px) {
            .card-kanji .kanji-only {
                font-size: 5.5vw;
            }
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #aaa;
            font-size: 16px;
            font-weight: 500;
        }
        .no-results span {
            display: block;
            font-size: 40px;
            margin-bottom: 12px;
        }

        #learn-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: white;
            display: none;
            flex-direction: column;
            z-index: 100;
        }

        .nav-top {
            padding: 10px 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
            background: var(--header-bg);
            padding-top: max(10px, env(safe-area-inset-top));
            padding-left: max(15px, env(safe-area-inset-left));
            padding-right: max(15px, env(safe-area-inset-right));
        }

        .nav-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-nav {
            padding: 8px 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            background: #eee;
            color: #333;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        .btn-nav:active {
            opacity: 0.7;
        }
        .btn-back {
            background: #e0e0e0;
        }
        .btn-clear {
            background: var(--danger);
            color: white;
        }
        .btn-prev-next {
            background: #ffffff;
            border: 1px solid #aaa;
        }
        #current-title {
            font-size: 18px;
            margin: 0 5px;
            text-align: center;
            flex: 0 1 auto;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 40%;
        }

        .main-view {
            flex: 1;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .main-view .box:first-child {
            flex: 2;
        }
        .main-view .box:last-child {
            flex: 3;
        }
        .box {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            position: relative;
        }

        #kanji-gif {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
            border-radius: 12px;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            container-type: size;
        }
        canvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            display: block;
            background-image: linear-gradient(#f0f0f0 1px, transparent 1px),
                linear-gradient(90deg, #f0f0f0 1px, transparent 1px);
            background-size: 20% 20%;
        }
        #trace-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(0, 0, 0, 0.05);
            pointer-events: none;
            white-space: nowrap;
            line-height: 1;
            font-size: 40vw;
        }
        @container (min-width: 1px) {
            #trace-text {
                font-size: min(70cqi, 70cqh);
            }
        }

        @media (max-aspect-ratio: 1/1) {
            .main-view {
                flex-direction: column;
            }
            .main-view .box:first-child {
                flex: 2;
            }
            .main-view .box:last-child {
                flex: 3;
            }
            .box {
                padding: 0;
            }
        }

        @media (max-width: 480px) {
            .grid-kanji {
                grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
                gap: 10px;
            }
            .card-kanji .kanji-only {
                font-size: clamp(22px, 6.5vw, 30px);
            }
            .card-kanji .reading-sm {
                font-size: 9px;
            }
            .search-wrap input {
                font-size: 15px;
                padding: 10px 40px 10px 14px;
            }
            .home-header h2 {
                font-size: 19px;
            }
        }
        @media (max-width: 380px) {
            .grid-kanji {
                grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
                gap: 8px;
            }
            .card-kanji .kanji-only {
                font-size: clamp(18px, 5.5vw, 24px);
            }
            .card-kanji .reading-sm {
                font-size: 7px;
            }
        }
    </style>
</head>
<body>

    <div id="home-screen">
        <div class="home-header">
            <h2>✍️ Katakana 46</h2>
            <div class="search-wrap">
                <input type="text" id="searchInput" placeholder="🔍 Tìm theo âm đọc (ア), Romaji (a), hoặc chữ Katakana" autocomplete="off" spellcheck="false">
                <button class="search-clear" id="searchClear" aria-label="Xóa tìm kiếm">✕</button>
            </div>
            <div class="search-stats" id="searchStats">Tổng số <em>46</em> Katakana</div>
        </div>
        <div class="grid-kanji" id="kanjiGrid"></div>
    </div>

    <div id="learn-screen">
        <div class="nav-top">
            <div class="nav-group">
                <button class="btn-nav btn-back" onclick="goHome()">← 戻る</button>
                <button class="btn-nav btn-prev-next" onclick="prevKanji()">← 前</button>
            </div>
            <h2 id="current-title">ア</h2>
            <div class="nav-group">
                <button class="btn-nav btn-prev-next" onclick="nextKanji()">次 →</button>
                <button class="btn-nav btn-clear" onclick="clearBoard()">消す</button>
            </div>
        </div>

        <div class="main-view">
            <div class="box">
                <img id="kanji-gif" src="" alt="GIF" onerror="this.style.display='none'">
            </div>
            <div class="box">
                <div class="canvas-container">
                    <div id="trace-text"></div>
                    <canvas id="canvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ---- BẢNG KATAKANA CHUẨN (theo thứ tự あいうえお) ----
            var standardKatakana = [
                "ア", "イ", "ウ", "エ", "オ",
                "カ", "キ", "ク", "ケ", "コ",
                "サ", "シ", "ス", "セ", "ソ",
                "タ", "チ", "ツ", "テ", "ト",
                "ナ", "ニ", "ヌ", "ネ", "ノ",
                "ハ", "ヒ", "フ", "ヘ", "ホ",
                "マ", "ミ", "ム", "メ", "モ",
                "ヤ", "ユ", "ヨ",
                "ラ", "リ", "ル", "レ", "ロ",
                "ワ", "ヲ", "ン"
            ];

            // Sử dụng mảng này làm dữ liệu chính
            var katakanaData = standardKatakana.slice();

            // ---- SỐ NÉT (ước lượng, giữ nguyên) ----
            var strokeCounts = {
                "ア": 3, "イ": 2, "ウ": 3, "エ": 3, "オ": 3,
                "カ": 2, "キ": 3, "ク": 3, "ケ": 3, "コ": 2,
                "サ": 3, "シ": 3, "ス": 2, "セ": 3, "ソ": 2,
                "タ": 3, "チ": 3, "ツ": 3, "テ": 3, "ト": 2,
                "ナ": 3, "ニ": 2, "ヌ": 2, "ネ": 4, "ノ": 2,
                "ハ": 2, "ヒ": 3, "フ": 4, "ヘ": 3, "ホ": 4,
                "マ": 2, "ミ": 3, "ム": 3, "メ": 2, "モ": 3,
                "ヤ": 3, "ユ": 2, "ヨ": 3,
                "ラ": 2, "リ": 2, "ル": 2, "レ": 3, "ロ": 3,
                "ワ": 2, "ヲ": 3, "ン": 2
            };

            // ---- ROMAJI ----
            var romajiMap = {
                "ア": "a", "イ": "i", "ウ": "u", "エ": "e", "オ": "o",
                "カ": "ka", "キ": "ki", "ク": "ku", "ケ": "ke", "コ": "ko",
                "サ": "sa", "シ": "shi", "ス": "su", "セ": "se", "ソ": "so",
                "タ": "ta", "チ": "chi", "ツ": "tsu", "テ": "te", "ト": "to",
                "ナ": "na", "ニ": "ni", "ヌ": "nu", "ネ": "ne", "ノ": "no",
                "ハ": "ha", "ヒ": "hi", "フ": "fu", "ヘ": "he", "ホ": "ho",
                "マ": "ma", "ミ": "mi", "ム": "mu", "メ": "me", "モ": "mo",
                "ヤ": "ya", "ユ": "yu", "ヨ": "yo",
                "ラ": "ra", "リ": "ri", "ル": "ru", "レ": "re", "ロ": "ro",
                "ワ": "wa", "ヲ": "wo", "ン": "n"
            };

            // ---- BIẾN TOÀN CỤC ----
            var canvas, ctx, gif, trace, title, home, learn, grid, searchInput, searchClear, searchStats;
            var drawing = false;
            var currentIndex = 0;
            var currentFilter = '';

            // ---- KHỞI TẠO ----
            function init() {
                home = document.getElementById('home-screen');
                learn = document.getElementById('learn-screen');
                canvas = document.getElementById('canvas');
                ctx = canvas.getContext('2d');
                gif = document.getElementById('kanji-gif');
                trace = document.getElementById('trace-text');
                title = document.getElementById('current-title');
                grid = document.getElementById('kanjiGrid');
                searchInput = document.getElementById('searchInput');
                searchClear = document.getElementById('searchClear');
                searchStats = document.getElementById('searchStats');

                renderGrid();

                // Sự kiện vẽ
                canvas.addEventListener('mousedown', startDrawing);
                canvas.addEventListener('mousemove', draw);
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('mouseleave', stopDrawing);
                canvas.addEventListener('touchstart', startDrawing, { passive: false });
                canvas.addEventListener('touchmove', draw, { passive: false });
                canvas.addEventListener('touchend', stopDrawing);
                canvas.addEventListener('touchcancel', stopDrawing);

                window.addEventListener('resize', function() {
                    requestAnimationFrame(resizeCanvas);
                });
                window.addEventListener('orientationchange', function() {
                    setTimeout(function() { requestAnimationFrame(resizeCanvas); }, 100);
                });

                // Sự kiện tìm kiếm
                searchInput.addEventListener('input', onSearchInput);
                searchClear.addEventListener('click', clearSearch);
                searchInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') {
                        clearSearch();
                        searchInput.blur();
                    }
                });
            }

            // ---- TÌM KIẾM ----
            function onSearchInput() {
                var q = searchInput.value;
                currentFilter = q;
                searchClear.classList.toggle('visible', q.length > 0);
                renderGrid();
            }

            function clearSearch() {
                searchInput.value = '';
                currentFilter = '';
                searchClear.classList.remove('visible');
                renderGrid();
                searchInput.focus();
            }

            // Lọc theo Katakana hoặc Romaji, giữ nguyên thứ tự
            function filterKatakana(query) {
                var trimmed = query.trim();
                if (!trimmed) return katakanaData;

                var q = trimmed.toLowerCase();
                var results = [];
                for (var i = 0; i < katakanaData.length; i++) {
                    var k = katakanaData[i];
                    var romaji = (romajiMap[k] || '').toLowerCase();
                    if (k.includes(q) || k === q || romaji.includes(q)) {
                        results.push(k);
                    }
                }
                return results;
            }

            // ---- RENDER GRID ----
            function renderGrid() {
                var filtered = filterKatakana(currentFilter);
                var total = katakanaData.length;
                var found = filtered.length;

                if (currentFilter.trim()) {
                    searchStats.innerHTML = '🔍 Tìm thấy <em>' + found + '</em> / ' + total + ' Katakana';
                } else {
                    searchStats.innerHTML = 'Tổng số <em>' + total + '</em> Katakana';
                }

                grid.innerHTML = '';

                if (found === 0) {
                    var empty = document.createElement('div');
                    empty.className = 'no-results';
                    empty.innerHTML = '<span>🔎</span> Không tìm thấy Katakana nào cho “' + currentFilter.trim() + '”';
                    grid.appendChild(empty);
                    return;
                }

                var isSearching = currentFilter.trim().length > 0;

                for (var i = 0; i < filtered.length; i++) {
                    var k = filtered[i];
                    var card = document.createElement('div');
                    card.className = 'card-kanji';
                    card.dataset.katakana = k;

                    var charSpan = document.createElement('span');
                    charSpan.className = 'kanji-only';
                    charSpan.textContent = k;
                    card.appendChild(charSpan);

                    if (isSearching) {
                        var romaji = romajiMap[k] || '';
                        if (romaji) {
                            var readingSpan = document.createElement('span');
                            readingSpan.className = 'reading-sm';
                            readingSpan.textContent = romaji;
                            card.appendChild(readingSpan);
                        }
                    }

                    card.onclick = (function(ch) {
                        return function() { startLearn(ch); };
                    })(k);

                    grid.appendChild(card);
                }
            }

            // ---- HỌC KATAKANA ----
            function updateLearnScreen(k) {
                var romaji = romajiMap[k] || '';
                title.innerText = k + (romaji ? ' (' + romaji + ')' : '');
                trace.innerText = k;
                gif.src = k + '-order.gif';
                gif.style.display = '';
                clearBoard();
                requestAnimationFrame(function() {
                    setTimeout(resizeCanvas, 50);
                });
            }

            function startLearn(k) {
                home.style.display = 'none';
                learn.style.display = 'flex';
                currentIndex = katakanaData.indexOf(k);
                if (currentIndex === -1) currentIndex = 0;
                updateLearnScreen(k);
            }

            window.prevKanji = function() {
                if (currentIndex > 0) {
                    currentIndex--;
                    updateLearnScreen(katakanaData[currentIndex]);
                }
            };

            window.nextKanji = function() {
                if (currentIndex < katakanaData.length - 1) {
                    currentIndex++;
                    updateLearnScreen(katakanaData[currentIndex]);
                }
            };

            window.goHome = function() {
                home.style.display = 'flex';
                learn.style.display = 'none';
                gif.src = '';
            };

            window.clearBoard = function() {
                if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            function resizeCanvas() {
                if (!canvas || !canvas.parentElement) return;
                var container = canvas.parentElement;
                var w = container.clientWidth;
                var h = container.clientHeight;
                canvas.width = w;
                canvas.height = h;
                clearBoard();
            }

            function getPos(e) {
                var rect = canvas.getBoundingClientRect();
                var scaleX = canvas.width / rect.width;
                var scaleY = canvas.height / rect.height;
                var clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                var x = (clientX - rect.left) * scaleX;
                var y = (clientY - rect.top) * scaleY;
                x = Math.min(Math.max(x, 0), canvas.width);
                y = Math.min(Math.max(y, 0), canvas.height);
                return { x: x, y: y };
            }

            function startDrawing(e) {
                if (e.preventDefault) e.preventDefault();
                drawing = true;
                ctx.beginPath();
                draw(e);
            }

            function stopDrawing() {
                drawing = false;
                ctx.beginPath();
            }

            function draw(e) {
                if (!drawing) return;
                if (e.preventDefault) e.preventDefault();
                var p = getPos(e);
                ctx.lineWidth = Math.max(8, canvas.width / 40);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = '#2d3436';
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
            }

            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>
</body>
</html>
