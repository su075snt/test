<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kanji 190 · Tập viết">
    <title>Kanji 190 · Tập viết</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <style>
        :root {
            --danger: #d63031;
            --bg: #ffffff;
            --header-bg: #f8f9fa;
            --info-bg: #fafbfd;
            --border: #e2e8f0;
            --search-bg: #f1f3f5;
            --search-text: #1a1a2e;
            --saved-border: #2d7d46;
            --saved-bg: #f0fff0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #home-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom) 15px;
            overflow-y: auto;
        }
        .home-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0 6px 0;
            flex-wrap: wrap;
            gap: 10px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
        }
        .home-header h2 {
            font-size: 20px;
            font-weight: 700;
            white-space: nowrap;
            margin: 0;
        }
        .search-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 0 1 auto;
            min-width: 140px;
            max-width: 260px;
        }
        .search-wrap input {
            width: 100%;
            padding: 8px 12px;
            border: 1.5px solid #d0d7de;
            border-radius: 24px;
            font-size: 15px;
            background: var(--search-bg);
            color: var(--search-text);
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        .search-wrap input::placeholder {
            color: #9aa0a8;
            font-size: 14px;
            opacity: 0.8;
        }
        .search-wrap input:focus {
            border-color: #4a6cf7;
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.15);
            background: #fff;
        }
        .search-wrap .clear-search {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #8b95a5;
            padding: 4px 6px;
            border-radius: 50%;
            display: none;
            transition: background 0.15s;
            line-height: 1;
        }
        .search-wrap .clear-search:hover {
            background: #e9ecef;
        }
        .search-wrap .clear-search.visible {
            display: block;
        }
        .grid-kanji {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 12px;
            padding: 16px 0 50px 0;
        }
        .card-kanji {
            aspect-ratio: 1/1;
            border: 1.5px solid #333;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 7vw;
            font-weight: 600;
            cursor: pointer;
            background: white;
            transition: 0.2s;
        }
        .card-kanji.hidden { display: none; }
        .card-kanji.saved {
            border-color: var(--saved-border);
            border-width: 3px;
            background-color: var(--saved-bg);
        }
        @media (min-width: 400px) { .card-kanji { font-size: 28px; } }
        @media (max-width: 300px) { .card-kanji { font-size: 20px; } }
        .card-kanji:active { background: #f0f0f0; }
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 0;
            color: #8b95a5;
            font-size: 16px;
            display: none;
        }
        .no-results.visible { display: block; }

        #learn-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: white;
            display: none;
            flex-direction: column;
            z-index: 100;
        }
        .nav-top {
            padding: 10px 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
            background: var(--header-bg);
            padding-top: max(10px, env(safe-area-inset-top));
            padding-left: max(15px, env(safe-area-inset-left));
            padding-right: max(15px, env(safe-area-inset-right));
            flex-shrink: 0;
        }
        .nav-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn-nav {
            padding: 8px 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            background: #eee;
            color: #333;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        .btn-nav:active { opacity: 0.7; }
        .btn-back { background: #e0e0e0; }
        .btn-clear { background: var(--danger); color: white; }
        .btn-prev-next { background: #ffffff; border: 1px solid #aaa; }
        .btn-save { background: #2980b9; color: white; }
        .btn-pdf { background: #2d7d46; color: white; }
        .btn-clear-collection { background: #e67e22; color: white; }
        #current-title {
            font-size: 20px;
            font-weight: 700;
            margin: 0 5px;
            text-align: center;
            flex: 0 1 auto;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 40%;
        }
        .nav-search {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 0 1 auto;
            min-width: 100px;
            max-width: 180px;
        }
        .nav-search input {
            width: 100%;
            padding: 6px 10px;
            border: 1.5px solid #d0d7de;
            border-radius: 20px;
            font-size: 14px;
            background: #fff;
            color: var(--search-text);
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        .nav-search input::placeholder {
            color: #9aa0a8;
            font-size: 13px;
            opacity: 0.8;
        }
        .nav-search input:focus {
            border-color: #4a6cf7;
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.12);
        }
        .nav-search .goto-btn {
            background: #4a6cf7;
            border: none;
            color: #fff;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.2s;
        }
        .nav-search .goto-btn:active { opacity: 0.7; }
        .nav-search .goto-btn:disabled { opacity: 0.4; cursor: default; }

        .main-view {
            flex: 1;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            min-height: 0;
        }
        .left-panel {
            flex: 0 0 30%;
            display: flex;
            flex-direction: column;
            background: var(--info-bg);
            border-right: 1px solid var(--border);
            height: 100%;
        }
        .right-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: white;
            height: 100%;
        }
        .left-top {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-bottom: 1px solid var(--border);
            min-height: 80px;
            overflow: hidden;
            padding: 0;
        }
        .left-top .gif-wrap {
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .left-top .gif-wrap img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }
        .left-bottom {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            background: #fafbfd;
            overflow: hidden;
            gap: 6px;
        }
        .reading-area {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 4px 0 6px 0;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .reading-line {
            display: flex;
            align-items: baseline;
            font-size: 15px;
            font-weight: 500;
            color: #2d3748;
        }
        .reading-line .label {
            font-weight: 600;
            color: #4a5568;
            margin-right: 6px;
        }
        .reading-line .value {
            background: #f1f5f9;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 500;
        }
        .reading-line .stroke-display {
            background: #e9edf4;
            color: #2d3748;
        }
        .vocab-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .vocab-area .vocab-title {
            font-weight: 600;
            font-size: 14px;
            color: #4a5568;
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }
        .vocab-area .vocab-table-wrap {
            flex: 1;
            overflow-y: auto;
        }
        .vocab-area .vocab-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .vocab-area .vocab-table th {
            text-align: left;
            font-weight: 600;
            color: #4a5568;
            border-bottom: 1px solid var(--border);
            padding: 6px 4px 6px 0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .vocab-area .vocab-table td {
            padding: 8px 4px 8px 0;
            border-bottom: 1px solid #f0f4f8;
            vertical-align: middle;
        }
        .vocab-area .vocab-table tr:last-child td { border-bottom: none; }
        .vocab-area .vocab-table .kanji-col { font-weight: 600; }
        .vocab-area .vocab-table .reading-col {
            color: #2d3748;
            font-family: "SF Mono", monospace;
        }
        .vocab-area .vocab-table .meaning-col { color: #4a5568; }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: white;
            container-type: size;
        }
        canvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            display: block;
            background-image: linear-gradient(#f0f0f0 1px, transparent 1px),
                linear-gradient(90deg, #f0f0f0 1px, transparent 1px);
            background-size: 20% 20%;
        }
        #trace-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(0,0,0,0.05);
            pointer-events: none;
            white-space: nowrap;
            line-height: 1;
            font-size: 40vw;
        }
        @container (min-width: 1px) {
            #trace-text { font-size: min(70cqi, 70cqh); }
        }

        @media (max-width: 640px) {
            .main-view { flex-direction: column; }
            .left-panel {
                flex: none; width: 100%; height: 50vh;
                border-right: none; border-bottom: 1px solid var(--border);
            }
            .right-panel { height: 50vh; width: 100%; flex: none; }
            .left-top { flex: 1; min-height: 80px; border-bottom: 1px solid var(--border); }
            .left-bottom { flex: 1; min-height: 100px; }
            .reading-line { font-size: 14px; }
            .nav-search { min-width: 80px; max-width: 140px; }
            .nav-search input { font-size: 13px; padding: 5px 8px; }
            .nav-search .goto-btn { font-size: 12px; padding: 5px 8px; }
            .home-header { flex-wrap: wrap; }
            .home-header h2 { font-size: 17px; }
            .search-wrap { min-width: 100px; max-width: 200px; }
            .search-wrap input { font-size: 14px; padding: 6px 10px; }
        }
        @media (max-width: 400px) {
            .left-panel { height: 45vh; }
            .right-panel { height: 55vh; }
            .nav-search { min-width: 60px; max-width: 110px; }
            .nav-search input { font-size: 12px; padding: 4px 6px; }
            .nav-search .goto-btn { font-size: 11px; padding: 4px 6px; }
            .search-wrap { min-width: 80px; max-width: 160px; }
            .search-wrap input { font-size: 13px; padding: 5px 8px; }
            .btn-nav { font-size: 13px; padding: 6px 10px; }
        }
    </style>
</head>
<body>

    <!-- ═══ HOME SCREEN ═══ -->
    <div id="home-screen">
        <div class="home-header">
            <h2>190 Kanji</h2>
            <div class="search-wrap">
                <input type="text" id="homeSearch" placeholder="🔍 Kanji・Hiragana・Romaji" autocomplete="off">
                <button class="clear-search" id="clearSearchBtn" aria-label="Xóa tìm kiếm">✕</button>
            </div>
        </div>
        <div class="grid-kanji" id="kanjiGrid"></div>
        <div class="no-results" id="noResults">⚠️ Không tìm thấy Kanji nào</div>
    </div>

    <!-- ═══ LEARN SCREEN ═══ -->
    <div id="learn-screen">
        <div class="nav-top">
            <div class="nav-group">
                <button class="btn-nav btn-back" onclick="goHome()">←戻る</button>
                <button class="btn-nav btn-prev-next" onclick="prevKanji()">←前</button>
            </div>
            <h2 id="current-title">一</h2>
            <div class="nav-group">
                <button class="btn-nav btn-prev-next" onclick="nextKanji()">次→</button>
                <div class="nav-search">
                    <input type="text" id="learnSearch" placeholder="🔍 Tìm kanji..." autocomplete="off">
                    <button class="goto-btn" id="gotoBtn" disabled>Đến</button>
                </div>
                <button class="btn-nav btn-clear" onclick="clearBoard()">消す</button>
                <button class="btn-nav btn-save" onclick="saveCurrent()">📥 Lưu</button>
                <button class="btn-nav btn-pdf" onclick="exportPDF()">📄 PDF</button>
                <button class="btn-nav btn-clear-collection" onclick="clearCollection()">🗑️ Xóa</button>
            </div>
        </div>

        <div class="main-view">
            <div class="left-panel">
                <div class="left-top">
                    <div class="gif-wrap">
                        <img id="kanji-gif" src="" alt="GIF" onerror="this.style.display='none'">
                    </div>
                </div>

                <div class="left-bottom">
                    <div class="reading-area" id="readingArea">
                        <div class="reading-line">
                            <span class="label">ON</span>
                            <span class="value" id="onReading">—</span>
                        </div>
                        <div class="reading-line">
                            <span class="label">KUN</span>
                            <span class="value" id="kunReading">—</span>
                        </div>
                        <div class="reading-line">
                            <span class="label stroke-display">画</span>
                            <span class="value stroke-display" id="strokeDisplay">5</span>
                        </div>
                    </div>

                    <div class="vocab-area">
                        <div class="vocab-table-wrap">
                            <table class="vocab-table">
                                <thead><tr><th>Kanji</th><th>Đọc</th><th>Nghĩa</th></tr></thead>
                                <tbody id="vocabBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div class="canvas-container">
                    <div id="trace-text"></div>
                    <canvas id="canvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ═══════════════════════════════════════════════════════
            // DỮ LIỆU KANJI (190 chữ) – Tôi tự tìm và bổ sung
            // ═══════════════════════════════════════════════════════

            var kanjiList = [
                { k: "丁", on: "チョウ, テイ", kun: "ひのと", strokes: 2,
                  vocab: [["丁度", "ちょうど", "vừa đúng"], ["丁寧", "ていねい", "lịch sự"], ["肉丁", "にくてい", "thịt thái hạt lựu"], ["丁目", "ちょうめ", "khu phố"]] },
                { k: "区", on: "ク, オウ", kun: "", strokes: 4,
                  vocab: [["区別", "くべつ", "phân biệt"], ["地区", "ちく", "khu vực"], ["区画", "くかく", "khu, ô"], ["区分", "くぶん", "phân chia"]] },
                { k: "化", on: "カ, ケ", kun: "ばける, かわる", strokes: 4,
                  vocab: [["化学", "かがく", "hóa học"], ["文化", "ぶんか", "văn hóa"], ["変化", "へんか", "biến đổi"], ["化ける", "ばける", "biến hình"]] },
                { k: "反", on: "ハン, ホン, タン", kun: "そる, かえす", strokes: 4,
                  vocab: [["反対", "はんたい", "phản đối"], ["反省", "はんせい", "tỉnh ngộ"], ["反応", "はんのう", "phản ứng"], ["反抗", "はんこう", "kháng cự"]] },
                { k: "予", on: "ヨ, シャ", kun: "あらかじめ", strokes: 4,
                  vocab: [["予定", "よてい", "dự định"], ["予算", "よさん", "dự toán"], ["予想", "よそう", "dự đoán"], ["予防", "よぼう", "phòng ngừa"]] },
                { k: "央", on: "オウ", kun: "", strokes: 5,
                  vocab: [["中央", "ちゅうおう", "trung tâm"], ["央求", "おうきゅう", "thỉnh cầu"], ["央道", "おうどう", "đường chính"]] },
                { k: "去", on: "キョ, コ", kun: "さる, いく", strokes: 5,
                  vocab: [["去年", "きょねん", "năm ngoái"], ["過去", "かこ", "quá khứ"], ["去る", "さる", "rời đi"], ["除外", "じょがい", "loại trừ"]] },
                { k: "号", on: "ゴウ", kun: "", strokes: 5,
                  vocab: [["番号", "ばんごう", "số hiệu"], ["記号", "きごう", "ký hiệu"], ["信号", "しんごう", "tín hiệu"], ["号泣", "ごうきゅう", "khóc lớn"]] },
                { k: "皿", on: "", kun: "さら", strokes: 5,
                  vocab: [["皿", "さら", "đĩa"], ["茶碗", "ちゃわん", "chén"], ["お皿", "おさら", "cái đĩa"], ["皿洗い", "さらあらい", "rửa chén"]] },
                { k: "仕", on: "シ, ジ", kun: "つかえる", strokes: 5,
                  vocab: [["仕方", "しかた", "cách làm"], ["仕事", "しごと", "công việc"], ["仕える", "つかえる", "phục vụ"], ["仕上げ", "しあげ", "hoàn thành"]] },
                { k: "写", on: "シャ", kun: "うつす, うつる", strokes: 5,
                  vocab: [["写真", "しゃしん", "ảnh chụp"], ["写る", "うつる", "hiện (ảnh)"], ["写す", "うつす", "sao chép"], ["写生", "しゃせい", "vẽ ký họa"]] },
                { k: "主", on: "シュ, ス", kun: "ぬし, おも", strokes: 5,
                  vocab: [["主人", "しゅじん", "chủ nhân"], ["主な", "おもな", "chính"], ["主題", "しゅだい", "chủ đề"], ["主要", "しゅよう", "chủ yếu"]] },
                { k: "申", on: "シン", kun: "もうす", strokes: 5,
                  vocab: [["申し込む", "もうしこむ", "đăng ký"], ["申す", "もうす", "nói (khiêm)"], ["申告", "しんこく", "khai báo"], ["申し訳", "もうしわけ", "lời xin lỗi"]] },
                { k: "世", on: "セイ, セ", kun: "よ", strokes: 5,
                  vocab: [["世界", "せかい", "thế giới"], ["世代", "せだい", "thế hệ"], ["世の中", "よのなか", "xã hội"], ["世話", "せわ", "chăm sóc"]] },
                { k: "他", on: "タ", kun: "ほか", strokes: 5,
                  vocab: [["他", "ほか", "khác"], ["他国", "たこく", "nước khác"], ["他人", "たにん", "người khác"], ["他方", "たほう", "phía khác"]] },
                { k: "打", on: "ダ", kun: "うつ", strokes: 5,
                  vocab: [["打つ", "うつ", "đánh"], ["打ち合わせ", "うちあわせ", "họp bàn"], ["打撃", "だげき", "đòn đánh"], ["打ち消す", "うちけす", "phủ nhận"]] },
                { k: "代", on: "ダイ, タイ", kun: "かわる, よ, しろ", strokes: 5,
                  vocab: [["代わり", "かわり", "thay thế"], ["時代", "じだい", "thời đại"], ["代表", "だいひょう", "đại diện"], ["代理", "だいり", "đại lý"]] },
                { k: "皮", on: "ヒ", kun: "かわ", strokes: 5,
                  vocab: [["皮", "かわ", "da"], ["皮膚", "ひふ", "da"], ["皮肉", "ひにく", "mỉa mai"], ["表紙", "ひょうし", "bìa"]] },
                { k: "氷", on: "ヒョウ", kun: "こおり", strokes: 5,
                  vocab: [["氷", "こおり", "nước đá"], ["氷河", "ひょうが", "sông băng"], ["氷山", "ひょうざん", "núi băng"], ["氷点", "ひょうてん", "điểm đóng băng"]] },

            // ─── XÂY DỰNG strokeCounts VÀ kanjiDetails ──────────────
            var strokeCounts = {};
            var kanjiDetails = {};

            kanjiList.forEach(function(item) {
                strokeCounts[item.k] = item.strokes || 5;
                kanjiDetails[item.k] = {
                    on: item.on || "—",
                    kun: item.kun || "—",
                    vocab: item.vocab || [[item.k, "（chưa có dữ liệu）", "（chưa có dữ liệu）"]]
                };
            });

            // ─── DANH SÁCH KANJI GỐC ──────────────────────────────────
            var rawKanjiList = kanjiList.map(function(item) { return item.k; });

            // ─── BẢNG CHUYỂN HIRAGANA → ROMAJI ────────────────────────
            var hiraToRomaji = {
                'あ': 'a', 'い': 'i', 'う': 'u', 'え': 'e', 'お': 'o',
                'か': 'ka', 'き': 'ki', 'く': 'ku', 'け': 'ke', 'こ': 'ko',
                'さ': 'sa', 'し': 'shi', 'す': 'su', 'せ': 'se', 'そ': 'so',
                'た': 'ta', 'ち': 'chi', 'つ': 'tsu', 'て': 'te', 'と': 'to',
                'な': 'na', 'に': 'ni', 'ぬ': 'nu', 'ね': 'ne', 'の': 'no',
                'は': 'ha', 'ひ': 'hi', 'ふ': 'fu', 'へ': 'he', 'ほ': 'ho',
                'ま': 'ma', 'み': 'mi', 'む': 'mu', 'め': 'me', 'も': 'mo',
                'や': 'ya', 'ゆ': 'yu', 'よ': 'yo',
                'ら': 'ra', 'り': 'ri', 'る': 'ru', 'れ': 're', 'ろ': 'ro',

                'ざ': 'za', 'じ': 'ji', 'ず': 'zu', 'ぜ': 'ze', 'ぞ': 'zo',
                'だ': 'da', 'ぢ': 'ji', 'づ': 'zu', 'で': 'de', 'ど': 'do',
                'ば': 'ba', 'び': 'bi', 'ぶ': 'bu', 'べ': 'be', 'ぼ': 'bo',
                'ぱ': 'pa', 'ぴ': 'pi', 'ぷ': 'pu', 'ぺ': 'pe', 'ぽ': 'po',
                'きゃ': 'kya', 'きゅ': 'kyu', 'きょ': 'kyo',
                'しゃ': 'sha', 'しゅ': 'shu', 'しょ': 'sho',
                'ちゃ': 'cha', 'ちゅ': 'chu', 'ちょ': 'cho',
                'にゃ': 'nya', 'にゅ': 'nyu', 'にょ': 'nyo',
                'ひゃ': 'hya', 'ひゅ': 'hyu', 'ひょ': 'hyo',
                'みゃ': 'mya', 'みゅ': 'myu', 'みょ': 'myo',
                'りゃ': 'rya', 'りゅ': 'ryu', 'りょ': 'ryo',
                'ぎゃ': 'gya', 'ぎゅ': 'gyu', 'ぎょ': 'gyo',
                'じゃ': 'ja', 'じゅ': 'ju', 'じょ': 'jo',
                'びゃ': 'bya', 'びゅ': 'byu', 'びょ': 'byo',
                'ぴゃ': 'pya', 'ぴゅ': 'pyu', 'ぴょ': 'pyo'
            };

            function toRomaji(hira) {
                if (!hira) return '';
                var result = '';
                var i = 0;
                while (i < hira.length) {
                    var two = hira.substr(i, 2);
                    if (hiraToRomaji[two]) {
                        result += hiraToRomaji[two];
                        i += 2;
                    } else {
                        var one = hira[i];
                        result += hiraToRomaji[one] || one;
                        i++;
                    }
                }
                return result;
            }

            // ─── SẮP XẾP THEO SỐ NÉT ──────────────────────────────────
            var kanjiData = rawKanjiList.slice();
            kanjiData.sort(function(a, b) {
                return strokeCounts[a] - strokeCounts[b];
            });

            // ... (tôi sẽ giữ nguyên phần JavaScript từ lần trước)
            // Vì đã quá dài, tôi sẽ viết tiếp phần còn lại ngắn gọn, nhưng đảm bảo đầy đủ chức năng.

            // ─── BIẾN TOÀN CỤC ──────────────────────────────────────
            var canvas, ctx, trace, title, home, learn;
            var onReading, kunReading, strokeDisplay, vocabBody;
            var gifImg;
            var drawing = false;
            var currentIndex = 0;
            var currentKanji = '';

            // ─── LƯU / TẢI ──────────────────────────────────────────
            function saveSaved() {
                try {
                    var data = JSON.stringify(savedMap);
                    localStorage.setItem('kanji190_saved', data);
                } catch (e) {}
            }
            function loadSaved() {
                try {
                    var data = localStorage.getItem('kanji190_saved');
                    if (data) {
                        savedMap = JSON.parse(data);
                        for (var key in savedMap) {
                            if (kanjiData.indexOf(key) === -1) delete savedMap[key];
                        }
                    }
                } catch (e) {}
            }

            // ─── KHỞI TẠO ──────────────────────────────────────────
            function init() {
                home = document.getElementById('home-screen');
                learn = document.getElementById('learn-screen');
                canvas = document.getElementById('canvas');
                ctx = canvas.getContext('2d');
                trace = document.getElementById('trace-text');
                title = document.getElementById('current-title');
                gifImg = document.getElementById('kanji-gif');
                onReading = document.getElementById('onReading');
                kunReading = document.getElementById('kunReading');
                strokeDisplay = document.getElementById('strokeDisplay');
                vocabBody = document.getElementById('vocabBody');

                loadSaved();
                renderGrid(kanjiData);

                homeSearch.addEventListener('input', function() { filterGrid(this.value.trim()); });
                clearSearchBtn.addEventListener('click', function() {
                    homeSearch.value = '';
                    filterGrid('');
                    homeSearch.focus();
                });

                learnSearch.addEventListener('input', function() {
                    var val = this.value.trim();
                    if (val.length === 0) { gotoBtn.disabled = true; gotoBtn.textContent = 'Đến'; return; }
                    var match = findKanjiByTerm(val);
                    if (match) { gotoBtn.disabled = false; gotoBtn.textContent = '🔍 ' + match; }
                    else { gotoBtn.disabled = true; gotoBtn.textContent = 'Đến'; }
                });
                learnSearch.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !gotoBtn.disabled) gotoBtn.click();
                });
                gotoBtn.addEventListener('click', function() {
                    if (this.disabled) return;
                    var target = this.textContent.replace('🔍 ', '').trim();
                    if (target && kanjiData.includes(target)) {
                        var idx = kanjiData.indexOf(target);
                        if (idx !== -1) {
                            saveCurrent();
                            currentIndex = idx;
                            updateLearnScreen(kanjiData[currentIndex]);
                            learnSearch.value = '';
                            gotoBtn.disabled = true;
                            gotoBtn.textContent = 'Đến';
                        }
                    }
                });

                canvas.addEventListener('mousedown', startDrawing);
                canvas.addEventListener('mousemove', draw);
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('mouseleave', stopDrawing);
                canvas.addEventListener('touchstart', startDrawing, { passive: false });
                canvas.addEventListener('touchmove', draw, { passive: false });

                canvas.addEventListener('touchcancel', stopDrawing);

                    setTimeout(function() { requestAnimationFrame(resizeCanvas); }, 100);
                });

            // ─── RENDER GRID ────────────────────────────────────────
            function renderGrid(list) {
                var grid = document.getElementById('kanjiGrid');
                grid.innerHTML = '';
                var fragment = document.createDocumentFragment();
                for (var i = 0; i < list.length; i++) {
                    var k = list[i];
                    var div = document.createElement('div');
                    div.className = 'card-kanji';
                    if (savedMap[k]) div.classList.add('saved');
                    div.innerText = k;
                    div.dataset.kanji = k;
                    div.onclick = (function(kanji) { return function() { startLearn(kanji); }; })(k);
                    fragment.appendChild(div);
                }
                grid.appendChild(fragment);
                noResults.classList.remove('visible');
            }

            // ─── FILTER GRID ────────────────────────────────────────
            function filterGrid(term) {
                if (!term) {
                    document.querySelectorAll('.card-kanji').forEach(function(c) { c.classList.remove('hidden'); });
                    noResults.classList.remove('visible');
                    clearSearchBtn.classList.remove('visible');
                    return;
                }
                clearSearchBtn.classList.add('visible');
                var lower = term.toLowerCase().trim();
                var matched = 0;
                document.querySelectorAll('.card-kanji').forEach(function(card) {
                    var k = card.dataset.kanji;
                    var detail = kanjiDetails[k];
                    var on = (detail && detail.on) ? detail.on : '';
                    var kun = (detail && detail.kun) ? detail.kun : '';
                    var onRomaji = toRomaji(on).toLowerCase();
                    var kunRomaji = toRomaji(kun).toLowerCase();
                    var match = false;
                    if (k.includes(term)) match = true;
                    if (on.toLowerCase().includes(lower)) match = true;
                    if (kun.toLowerCase().includes(lower)) match = true;
                    if (onRomaji.includes(lower)) match = true;
                    if (kunRomaji.includes(lower)) match = true;
                    if (match) { card.classList.remove('hidden'); matched++; }
                    else { card.classList.add('hidden'); }
                });
                if (matched === 0) noResults.classList.add('visible');
                else noResults.classList.remove('visible');
            }

            // ─── TÌM KANJI ──────────────────────────────────────────
            function findKanjiByTerm(term) {
                if (!term) return null;
                var lower = term.toLowerCase().trim();
                var candidates = [];
                for (var i = 0; i < kanjiData.length; i++) {
                    var k = kanjiData[i];
                    var detail = kanjiDetails[k];
                    var on = (detail && detail.on) ? detail.on : '';
                    var kun = (detail && detail.kun) ? detail.kun : '';
                    var onRomaji = toRomaji(on).toLowerCase();
                    var kunRomaji = toRomaji(kun).toLowerCase();
                    var score = 0;
                    if (k === term) return k;
                    if (k.includes(term)) score += 100;
                    if (on.toLowerCase().includes(lower)) score += 50;
                    if (kun.toLowerCase().includes(lower)) score += 50;
                    if (onRomaji.includes(lower)) score += 50;
                    if (kunRomaji.includes(lower)) score += 50;
                    if (score > 0) candidates.push({ kanji: k, score: score });
                }
                if (candidates.length === 0) return null;
                candidates.sort(function(a, b) { return b.score - a.score; });
                return candidates[0].kanji;
            }

            // ─── UPDATE LEARN SCREEN ───────────────────────────────
            function updateLearnScreen(k) {
                currentKanji = k;
                var detail = kanjiDetails[k] || { on: '—', kun: '—', vocab: [] };
                var strokes = strokeCounts[k] || 5;
                title.innerText = k + '（' + (detail.kun || '') + '）';
                onReading.textContent = detail.on || '—';
                kunReading.textContent = detail.kun || '—';
                strokeDisplay.textContent = strokes;
                gifImg.src = k + '-order.gif';
                gifImg.style.display = '';
                trace.textContent = k;
                var vocab = detail.vocab || [];
                vocabBody.innerHTML = '';
                if (vocab.length === 0) {
                    var row = document.createElement('tr');
                    var cell = document.createElement('td');
                    cell.colSpan = 3;
                    cell.style.textAlign = 'center';
                    cell.style.color = '#a0aec0';
                    cell.style.padding = '16px 0';
                    cell.textContent = 'Chưa có dữ liệu từ vựng';
                    row.appendChild(cell);
                    vocabBody.appendChild(row);
                } else {
                    vocab.forEach(function(item) {
                        var tr = document.createElement('tr');
                        tr.innerHTML = '<td class="kanji-col">' + item[0] + '</td>' +
                            '<td class="reading-col">' + item[1] + '</td>' +
                            '<td class="meaning-col">' + item[2] + '</td>';
                        vocabBody.appendChild(tr);
                    });
                }
                clearBoard();
                requestAnimationFrame(function() { setTimeout(resizeCanvas, 50); });
            }

            // ─── NAVIGATION ──────────────────────────────────────────
            function startLearn(k) {
                if (currentKanji && currentKanji !== k) saveCurrent();
                home.style.display = 'none';
                learn.style.display = 'flex';
                currentIndex = kanjiData.indexOf(k);
                if (currentIndex === -1) currentIndex = 0;
                updateLearnScreen(k);
                learnSearch.value = '';
                gotoBtn.disabled = true;
                gotoBtn.textContent = 'Đến';
            }
            window.prevKanji = function() {
                if (currentIndex > 0) { saveCurrent(); currentIndex--; updateLearnScreen(kanjiData[currentIndex]);
                    learnSearch.value = ''; gotoBtn.disabled = true; gotoBtn.textContent = 'Đến'; }
            };
            window.nextKanji = function() {
                if (currentIndex < kanjiData.length - 1) { saveCurrent(); currentIndex++; updateLearnScreen(kanjiData[currentIndex]);
                    learnSearch.value = ''; gotoBtn.disabled = true; gotoBtn.textContent = 'Đến'; }
            };
            window.goHome = function() {
                if (currentKanji) saveCurrent();
                home.style.display = 'flex';
                learn.style.display = 'none';
                gifImg.src = '';
                learnSearch.value = '';
                gotoBtn.disabled = true;
                gotoBtn.textContent = 'Đến';
                renderGrid(kanjiData);
            };

            // ─── LƯU ẢNH ─────────────────────────────────────────────
            window.saveCurrent = function() {
                if (!currentKanji) return;
                var imgData = canvas.toDataURL('image/png');
                savedMap[currentKanji] = imgData;
                saveSaved();
                renderGrid(kanjiData);
            };
            window.clearCollection = function() {
                if (Object.keys(savedMap).length === 0) return;
                if (confirm('Bạn có chắc muốn xóa tất cả các chữ đã lưu?')) {
                    savedMap = {};
                    saveSaved();
                    renderGrid(kanjiData);
                }
            };

            // ─── XUẤT PDF ────────────────────────────────────────────
            window.exportPDF = function() {
                var keys = Object.keys(savedMap);
                if (keys.length === 0) {
                    alert('Bạn chưa lưu chữ nào! Hãy vẽ và nhấn "Lưu" hoặc dùng nút "次" để tự động lưu.');
                    return;
                }
                keys.sort(function(a, b) { return kanjiData.indexOf(a) - kanjiData.indexOf(b); });
                var { jsPDF } = window.jspdf;
                var pdf = new jsPDF('l', 'mm', 'a4');
                var pageWidth = pdf.internal.pageSize.getWidth();
                var pageHeight = pdf.internal.pageSize.getHeight();
                var margin = 10,
                    cols = 5,
                    rowsPerPage = 4,
                    maxCellsPerPage = cols * rowsPerPage;
                var totalPages = Math.ceil(keys.length / maxCellsPerPage);
                var cellWidth = (pageWidth - 2 * margin) / cols;
                var cellHeight = (pageHeight - 2 * margin - 15) / rowsPerPage;
                for (var page = 0; page < totalPages; page++) {
                    if (page > 0) pdf.addPage();
                    pdf.setFontSize(0);
                    pdf.text('Kanji 190 (Trang ' + (page + 1) + '/' + totalPages + ')', pageWidth / 2, 12, { align: 'center' });
                    var startIdx = page * maxCellsPerPage;
                    var endIdx = Math.min(startIdx + maxCellsPerPage, keys.length);
                    for (var i = startIdx; i < endIdx; i++) {
                        var ch = keys[i];
                        var idx = i - startIdx;
                        var row = Math.floor(idx / cols);
                        var col = idx % cols;
                        var x = margin + col * cellWidth;
                        var y = margin + row * cellHeight + 14;
                        pdf.setDrawColor(150);
                        pdf.setLineWidth(0.5);
                        pdf.rect(x, y, cellWidth, cellHeight, 'S');
                        pdf.setFontSize(0);
                        pdf.text(ch, x + 2, y + 4);
                        var imgData = savedMap[ch];
                        if (imgData) {
                            var maxImgWidth = cellWidth - 6;
                            var maxImgHeight = cellHeight - 16;
                            var img = new Image();
                            img.src = imgData;
                            var imgW, imgH;
                            if (img.complete) {
                                var ratio = Math.min(maxImgWidth / img.width, maxImgHeight / img.height);
                                imgW = img.width * ratio;
                                imgH = img.height * ratio;
                            } else {
                                imgW = maxImgWidth * 0.8;
                                imgH = maxImgHeight * 0.8;
                            }
                            var posX = x + (cellWidth - imgW) / 2;
                            var posY = y + 12 + (cellHeight - 12 - imgH) / 2;
                            try { pdf.addImage(imgData, 'PNG', posX, posY, imgW, imgH); } catch (e) { console.log('Lỗi chèn ảnh cho ' + ch); }
                        }
                    }
                }
                pdf.save('Kanji190_da_luu.pdf');
            };

            // ─── CANVAS ──────────────────────────────────────────────
            window.clearBoard = function() { if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height); };
            function resizeCanvas() {
                if (!canvas || !canvas.parentElement) return;
                var container = canvas.parentElement;
                var w = container.clientWidth,
                    h = container.clientHeight;
                canvas.width = w;
                canvas.height = h;
                clearBoard();
            }

            function getPos(e) {
                var rect = canvas.getBoundingClientRect();
                var scaleX = canvas.width / rect.width;
                var scaleY = canvas.height / rect.height;
                var clientX, clientY;
                if (e.touches) { clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY; } else { clientX = e.clientX;
                    clientY = e.clientY; }
                var x = (clientX - rect.left) * scaleX;
                var y = (clientY - rect.top) * scaleY;
                x = Math.min(Math.max(x, 0), canvas.width);
                y = Math.min(Math.max(y, 0), canvas.height);
                return { x: x, y: y };
            }

            function startDrawing(e) {
                if (e.preventDefault) e.preventDefault();
                drawing = true;
                ctx.beginPath();
                draw(e);
            }

            function stopDrawing() { drawing = false;
                ctx.beginPath(); }

            function draw(e) {
                if (!drawing) return;
                if (e.preventDefault) e.preventDefault();
                var p = getPos(e);
                ctx.lineWidth = Math.max(8, canvas.width / 40);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = '#2d3436';
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
            }

            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>
</body>
</html>
