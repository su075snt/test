<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="けいさんボード">
<meta name="theme-color" content="#f2f5fa">
<title>けいさんボード</title>
<style>
:root{
  --bg:#f2f5fa; --card:#ffffff; --line:#e2e8f2;
  --ink:#1b2a4a; --muted:#697690;
  --blue:#3b82f6; --green:#16a34a;
  --num-size: 96px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  position:fixed;inset:0;display:flex;flex-direction:column;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","SF Pro Rounded",sans-serif;
  background:var(--bg);color:var(--ink);
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding-top:env(safe-area-inset-top);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
  padding-bottom:env(safe-area-inset-bottom);
}

/* ================= 上のバー ================= */
.topbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  padding:8px 12px;background:var(--card);
  border-bottom:1px solid var(--line);
  box-shadow:0 2px 14px rgba(20,30,60,.06);
  z-index:10;
  flex-shrink:0;
}
.group{display:flex;align-items:center;background:#eef1f7;border-radius:14px;padding:4px;gap:3px}

.ops button{
  width:56px;height:44px;border:0;border-radius:10px;background:transparent;
  font-size:26px;font-weight:800;color:#697690;line-height:1;
  transition:.15s;
}
.ops button.on{background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(59,130,246,.45)}

.picker .lbl{
  font-size:14px;font-weight:800;color:var(--muted);
  padding:0 6px 0 10px;white-space:nowrap;letter-spacing:.2px;line-height:1.1;
}
.picker .lbl small{
  display:block;font-size:10px;font-weight:700;color:#9aa5bc;
  letter-spacing:.4px;margin-top:1px;
}
.picker .val{
  min-width:46px;text-align:center;font-size:26px;font-weight:800;
  font-variant-numeric:tabular-nums;color:var(--ink);line-height:1;
}
.picker button{
  width:40px;height:40px;border:0;border-radius:11px;background:#fff;
  font-size:21px;font-weight:800;color:#41506e;line-height:1;
  box-shadow:0 1px 3px rgba(20,30,60,.12);
}
.picker button:active{background:#dfe6f2}

.start{
  margin-left:auto;height:52px;padding:0 28px;border:0;border-radius:14px;
  background:linear-gradient(180deg,#22c55e,#15a34a);color:#fff;
  font-size:18px;font-weight:900;letter-spacing:.6px;
  box-shadow:0 4px 16px rgba(22,163,74,.38);
}
.start:active{transform:translateY(1px)}

/* ================= ステージ (80:20) ================= */
.stage{
  position:relative;
  flex:1;
  min-height:0;
  display:flex;
  overflow:hidden;
}

/* ---- 左80%：けいさん ---- */
.problem-area{
  position:relative;
  flex: 0 0 80%;
  max-width: 80%;
  min-width:0;
  height:100%;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  background:var(--bg);
}

.hint{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:30px;color:var(--muted);
  font-size:clamp(15px,1.8vw,20px);font-weight:700;line-height:1.8;
  pointer-events:none;
}
.hint b{color:var(--green)}
body.started .hint{display:none}

/* ★ けいさん を ひだり 80% の まんなか に おく
   （キャリー よう の から の ます ぶん だけ ひだり に ずらす） */
.problem{
  position:relative;z-index:1;
  opacity:0;transition:opacity .25s ease;
  pointer-events:none;
  padding:8px;
  /* から の 1れつ ぶん を うちけす */
  transform: translateX(-0.5em);
}
body.started .problem{opacity:1}

.pgrid{
  display:grid;
  grid-template-columns: auto repeat(var(--n, 3), 1.05em);
  justify-content:center;
  font-size:clamp(2.4rem,11vh,7rem);
  font-weight:400;
  line-height:1.05;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
}
.pgrid .cell{
  display:flex;align-items:center;justify-content:center;
  width:1.05em;height:1.05em;
  border-radius:8px;
  transition: background .15s, outline .15s;
  position:relative;
  pointer-events:none;
}
.pgrid .cell.sign{
  color:var(--blue);
  width:auto;padding-right:.15em;
  justify-content:flex-end;
}
.pgrid .cell.carry{
  height:.62em;
  font-size:.5em;
  color:#ef4444;
  font-weight:900;
  align-items:flex-end;
  padding-bottom:1px;
  justify-content:flex-end;
  padding-right:.08em;
}
.pgrid .sep{
  grid-column: 1 / -1;
  height:.055em;
  background:var(--ink);
  border-radius:99px;
  margin:.14em 0 .14em .2em;
  opacity:.85;
}
.pgrid .cell.answer{
  color:#0f5132;
}

body.dragging .pgrid .cell.droppable{
  background: rgba(59,130,246,.10);
  outline: 1.5px dashed rgba(59,130,246,.55);
  outline-offset: -2px;
}
body.dragging .pgrid .cell.droppable.over{
  background: rgba(34,197,94,.22);
  outline-color: #22c55e;
  outline-style: solid;
}

.pgrid .cell.answer.correct{
  background: #d9f2e2;
  color: #0f5132;
  outline: 2px solid #22c55e;
  outline-offset: -2px;
}
.pgrid .cell.answer.wrong{
  background: #ffe4e6;
  color: #be123c;
  outline: 2px solid #ef4444;
  outline-offset: -2px;
}
.pgrid .cell.answer.missing{
  background: #fff3c4;
  color: #b45309;
  outline: 2px solid #f59e0b;
  outline-offset: -2px;
}

@keyframes cellPop{
  0%   { transform: scale(.6); opacity:.4; }
  60%  { transform: scale(1.18); }
  100% { transform: scale(1); opacity:1; }
}
.pgrid .cell.justFilled{
  animation: cellPop .38s cubic-bezier(.2,1.5,.5,1);
}

#ink{
  position:absolute;inset:0;width:100%;height:100%;
  touch-action:none;z-index:2;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
body.started #ink{opacity:1;pointer-events:auto}

.dropped-layer{
  position:absolute;inset:0;z-index:3;
  pointer-events:none;
  overflow:hidden;
}

/* ---- 右20%：パレット ---- */
.palette{
  flex: 0 0 20%;
  max-width: 20%;
  min-width:0;
  height:100%;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:8px 6px;
  background:var(--card);
  border-left:2px solid var(--line);
  box-shadow:-4px 0 16px rgba(20,30,60,.05);
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  z-index:5;
}
body.started .palette{display:flex}

.num-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:6px;
  width:100%;
  max-width:100%;
  justify-items:center;
}
.pal-btn{
  width: clamp(34px, 8vw, 64px);
  height: clamp(34px, 8vw, 64px);
  border:0;
  border-radius:12px;
  background:#ffffff;
  color:var(--ink);
  font-size: clamp(20px, 4.5vw, 34px);
  font-weight:400;
  line-height:1;
  font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(20,30,60,.12), inset 0 0 0 1px #e2e8f2;
  touch-action:none;
  user-select:none;-webkit-user-select:none;
  cursor:grab;
  transition:background .12s, transform .12s;
}
.pal-btn:active{background:#eef1f7;transform:scale(.95)}

.red-row{
  display:flex;
  flex-direction:row;
  gap:8px;
  justify-content:center;
  align-items:center;
  padding-top:8px;
  border-top:1.5px dashed #e2e8f2;
  width:100%;
}
.pal-btn.red{
  background: transparent;
  box-shadow: none;
  color:#dc2626;
  font-weight:900;
  border:none;
  width: clamp(30px, 7vw, 54px);
  height: clamp(30px, 7vw, 54px);
  font-size: clamp(18px, 4vw, 30px);
}
.pal-btn.red:active{background:transparent;transform:scale(.9)}

/* ===== 赤い数字 (自由に動かせる) ===== */
.dropped-token{
  position:absolute;
  transform:translate(-50%,-50%);
  pointer-events:auto;
  touch-action:none;
  user-select:none;-webkit-user-select:none;
  font-variant-numeric:tabular-nums;
  cursor:grab;
  background: transparent;
  border: none;
  box-shadow: none;
  color:#dc2626;
  font-weight:900;
  width:calc(var(--num-size) * .8);
  height:calc(var(--num-size) * .8);
  font-size:calc(var(--num-size) * .68);
  display:flex;align-items:center;justify-content:center;
  line-height:1;
}
.dropped-token.dragging{
  transform:translate(-50%,-50%) scale(1.08);
  z-index:10;
  cursor:grabbing;
}

.del-x{
  position:absolute;
  top: -8px;
  right: -8px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #dc2626;
  color: #fff;
  font-size: 15px;
  font-weight: 900;
  line-height: 1;
  border: 2px solid #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  box-shadow: 0 2px 6px rgba(220,38,38,.45);
  cursor: pointer;
  touch-action: manipulation;
  pointer-events: auto;
  z-index: 2;
}
.del-x:active{
  background: #991b1b;
  transform: scale(.9);
}

.ghost-token{
  position:fixed;
  display:flex;align-items:center;justify-content:center;
  font-weight:400;line-height:1;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  z-index:9999;
  pointer-events:none;
  transform:translate(-50%,-50%) scale(1.06);
  opacity:.95;
  background:rgba(255,255,255,.96);
  border:2px solid #dbe3ef;
  border-radius:calc(var(--num-size) * .16);
  box-shadow:0 14px 34px rgba(20,30,60,.28);
  width:var(--num-size);
  height:var(--num-size);
  font-size:var(--num-size);
}
.ghost-token.red{
  color:#dc2626;
  font-weight:900;
  background: transparent;
  border: none;
  box-shadow: none;
  width:calc(var(--num-size) * .8);
  height:calc(var(--num-size) * .8);
  font-size:calc(var(--num-size) * .68);
}

/* ===== ★ ツールバー (ひだり 80% の まんなか) ===== */
.floating{
  position:absolute;
  z-index:6;
  /* problem-area (80%) の なか で まんなか → がめん ぜんたい の 40% */
  left: 50%;
  transform:translateX(-50%);
  bottom:calc(14px + env(safe-area-inset-bottom));
  display:none;gap:10px;padding:8px;
  background:rgba(255,255,255,.92);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:20px;
  box-shadow:0 8px 30px rgba(20,30,60,.18);
}
body.started .floating{display:flex}
.floating button{
  height:58px;min-width:58px;padding:0 16px;border:0;border-radius:15px;background:#eef1f7;
  font-size:16px;font-weight:800;line-height:1;color:#41506e;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.floating button:active{background:#dfe6f2;transform:scale(.96)}
.floating .danger{background:#ffe9ec;color:#be123c;font-size:26px;padding:0;width:58px;font-weight:600}
.floating .clean{background:#e0f2fe;color:#0369a1;font-size:24px;padding:0;width:58px}
.floating .new{font-size:24px;padding:0;width:58px}

/* ===== ✓ ボタン (右下) ===== */
.check-btn{
  position:fixed;
  right:calc(16px + env(safe-area-inset-right));
  bottom:calc(16px + env(safe-area-inset-bottom));
  width:82px;height:82px;
  border-radius:50%;
  background:linear-gradient(180deg,#3b82f6,#2563eb);
  color:#fff;
  font-size:34px;
  font-weight:900;
  line-height:1;
  border:0;
  box-shadow:0 8px 24px rgba(37,99,235,.45);
  z-index:7;
  display:none;
  align-items:center;justify-content:center;
  transition:transform .15s, box-shadow .15s;
}
body.started .check-btn{display:flex}
.check-btn:active{
  transform:scale(.9);
  box-shadow:0 4px 14px rgba(37,99,235,.6);
}

/* ===== トースト ===== */
.toast{
  position:fixed;
  top:calc(84px + env(safe-area-inset-top));
  left:50%;
  transform:translate(-50%,-20px);
  padding:16px 26px;
  border-radius:18px;
  font-size:20px;font-weight:900;letter-spacing:.3px;
  color:#fff;
  background:linear-gradient(180deg,#22c55e,#16a34a);
  box-shadow:0 10px 30px rgba(22,163,74,.45);
  z-index:30;
  opacity:0;pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
  max-width:calc(100% - 40px);
  text-align:center;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.error{
  background:linear-gradient(180deg,#f87171,#dc2626);
  box-shadow:0 10px 30px rgba(220,38,38,.45);
}
</style>
</head>
<body>

<header class="topbar">
  <div class="group ops">
    <button data-op="+" class="on">＋</button>
    <button data-op="-">−</button>
  </div>

  <div class="group picker">
    <span class="lbl">かず１<small>けた</small></span>
    <button data-step="d1" data-d="-1">−</button>
    <span class="val" id="d1v">2</span>
    <button data-step="d1" data-d="1">＋</button>
  </div>

  <div class="group picker">
    <span class="lbl">かず２<small>けた</small></span>
    <button data-step="d2" data-d="-1">−</button>
    <span class="val" id="d2v">2</span>
    <button data-step="d2" data-d="1">＋</button>
  </div>

  <button class="start" id="startBtn">スタート</button>
</header>

<main class="stage" id="stage">
  <div class="problem-area" id="problemArea">
    <div class="hint" id="hint">
      たしざん か ひきざん を えらんで、<br>
      かず１・かず２ の <b>けた</b> を きめて、<br>
      <b>スタート</b> を おしてね ✏️<br>
      <span style="font-size:.85em;opacity:.75">
        みぎの すうじ を けいさん の わく に はこんでね
      </span>
    </div>

    <div class="problem" id="problem">
      <div class="pgrid" id="pgrid"></div>
    </div>

    <canvas id="ink"></canvas>

    <div class="dropped-layer" id="droppedLayer"></div>

    <div class="floating">
      <button id="clearBtn" class="danger" title="いちばん さいご の せん を けす">↺</button>
      <button id="cleanTokensBtn" class="clean" title="もとの もんだい に もどす">けす🧹</button>
      <button id="newBtn" class="new" title="あたらしい もんだい">つぎ</button>
    </div>
  </div>

  <div class="palette" id="palette">
    <div class="num-grid">
      <button class="pal-btn" data-token="0">0</button>
      <button class="pal-btn" data-token="1">1</button>
      <button class="pal-btn" data-token="2">2</button>
      <button class="pal-btn" data-token="3">3</button>
      <button class="pal-btn" data-token="4">4</button>
      <button class="pal-btn" data-token="5">5</button>
      <button class="pal-btn" data-token="6">6</button>
      <button class="pal-btn" data-token="7">7</button>
      <button class="pal-btn" data-token="8">8</button>
      <button class="pal-btn" data-token="9">9</button>
    </div>
    <div class="red-row">
      <button class="pal-btn red" data-token="+1" title="くりあがり">1</button>
      <button class="pal-btn red" data-token="-1" title="くりさがり">-1</button>
    </div>
  </div>
</main>

<button id="checkBtn" class="check-btn" title="まるつけ">けっか</button>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.prototype.slice.call(r.querySelectorAll(s));
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;

const MIN_DIGITS = 1;
const MAX_DIGITS = 4;

const S = { op:'+', d1:2, d2:2, started:false, a:0, b:0 };

const problemEl = $('#problem');
const problemArea = $('#problemArea');
const pgrid = $('#pgrid');
const stage = $('#stage');
const palette = $('#palette');
const droppedLayer = $('#droppedLayer');
const canvas = $('#ink');
const ctx = canvas.getContext('2d');
const root = document.documentElement;
const toast = $('#toast');

function randomWithDigits(d){
  const min = (d === 1) ? 1 : Math.pow(10, d - 1);
  const max = Math.pow(10, d) - 1;
  return rnd(min, max);
}

/* ===== てがき ===== */
let strokes = [], current = null, drawing = false;

function fit(){
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const r = canvas.getBoundingClientRect();
  if (!r.width || !r.height) return;
  canvas.width  = Math.round(r.width  * dpr);
  canvas.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  redraw();
}

function paint(s){
  const p = s.pts;
  if (!p.length) return;
  if (p.length === 1){
    ctx.beginPath();
    ctx.arc(p[0].x, p[0].y, s.w/2, 0, Math.PI*2);
    ctx.fillStyle = s.color; ctx.fill();
    return;
  }
  ctx.beginPath();
  ctx.moveTo(p[0].x, p[0].y);
  for (let i=1;i<p.length;i++) ctx.lineTo(p[i].x, p[i].y);
  ctx.strokeStyle = s.color;
  ctx.lineWidth = s.w;
  ctx.stroke();
}

function redraw(){
  const r = canvas.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  for (let i=0;i<strokes.length;i++) paint(strokes[i]);
}

function clearInk(){ strokes = []; current = null; drawing = false; redraw(); }
function eraseLastStroke(){ if (strokes.length === 0) return; strokes.pop(); current = null; redraw(); }

function localPos(e){
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

canvas.addEventListener('pointerdown', e=>{
  if (!S.started || drawing) return;
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch(_){}
  drawing = true;
  const p = localPos(e);
  current = { color:'#16305c', w: e.pointerType === 'pen' ? 3 : 3.5, pts:[p] };
  strokes.push(current);
  paint(current);
});

canvas.addEventListener('pointermove', e=>{
  if (!drawing || !current) return;
  e.preventDefault();
  const evts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (let k=0;k<evts.length;k++){
    const p = localPos(evts[k]);
    const last = current.pts[current.pts.length-1];
    const dx = p.x-last.x, dy = p.y-last.y;
    if (dx*dx + dy*dy < 1.2) continue;
    current.pts.push(p);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = current.color;
    ctx.lineWidth = current.w;
    ctx.stroke();
  }
});

function endStroke(){ drawing = false; current = null; }
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);

/* ===== がめん こうしん ===== */
function render(){
  $('#d1v').textContent = S.d1;
  $('#d2v').textContent = S.d2;
  $$('.ops button').forEach(b => b.classList.toggle('on', b.dataset.op === S.op));
}

$$('.ops button').forEach(b=>{
  b.addEventListener('click', ()=>{ S.op = b.dataset.op; render(); });
});

$$('[data-step]').forEach(b=>{
  b.addEventListener('click', ()=>{
    const k = b.dataset.step, d = +b.dataset.d;
    S[k] = Math.max(MIN_DIGITS, Math.min(MAX_DIGITS, S[k] + d));
    render();
  });
});

/* ===== わく を かく ===== */
const FONT_SIZES = {
  1: 'clamp(3.6rem, 20vh, 9rem)',
  2: 'clamp(3rem, 15vh, 7rem)',
  3: 'clamp(2.2rem, 11vh, 5.4rem)',
  4: 'clamp(1.6rem, 8vh, 4rem)',
  5: 'clamp(1.3rem, 6.5vh, 3.4rem)'
};

function renderProblemGrid(a, b, op){
  const sa = String(a).split('');
  const sb = String(b).split('');
  const n = Math.max(sa.length, sb.length);

  const padA = ['', ...Array(n - sa.length).fill(''), ...sa];
  const padB = ['', ...Array(n - sb.length).fill(''), ...sb];
  const cols = n + 1;

  let html = '';

  html += '<div class="cell no-drop"></div>';
  for (let c = 0; c < cols; c++)
    html += `<div class="cell carry no-drop" data-col="${c}"></div>`;

  html += '<div class="cell no-drop"></div>';
  for (let c = 0; c < cols; c++){
    const d = padA[c] || '';
    html += `<div class="cell digit droppable" data-row="1" data-col="${c}" data-orig="${d}">${d}</div>`;
  }

  html += `<div class="cell sign no-drop">${op === '-' ? '−' : '＋'}</div>`;
  for (let c = 0; c < cols; c++){
    const d = padB[c] || '';
    html += `<div class="cell digit droppable" data-row="2" data-col="${c}" data-orig="${d}">${d}</div>`;
  }

  html += '<div class="sep"></div>';

  html += '<div class="cell no-drop"></div>';
  for (let c = 0; c < cols; c++)
    html += `<div class="cell answer droppable" data-row="4" data-col="${c}" data-orig=""></div>`;

  pgrid.style.setProperty('--n', cols);
  pgrid.innerHTML = html;

  const fontKey = Math.min(Math.max(cols, 1), 5);
  problemEl.style.fontSize = FONT_SIZES[fontKey] || FONT_SIZES[5];
}

function syncNumSize(){
  const cs = getComputedStyle(pgrid);
  const fs = parseFloat(cs.fontSize);
  if (fs) root.style.setProperty('--num-size', fs + 'px');
}

/* ===== もんだい を つくる ===== */
function buildProblem(){
  const realOp = S.op;
  let a = randomWithDigits(S.d1);
  let b = randomWithDigits(S.d2);
  if (realOp === '-' && a < b){ const t = a; a = b; b = t; }

  S.a = a; S.b = b;

  renderProblemGrid(a, b, realOp);

  S.started = true;
  document.body.classList.add('started');
  render();
  clearInk();
  clearAllTokens();

  requestAnimationFrame(()=>{
    syncNumSize();
    fit();
  });
}

/* ===== ばしょ を さがす ===== */
function findCellAtPoint(clientX, clientY){
  const cells = $$('#pgrid .cell.droppable');
  for (const cell of cells){
    const r = cell.getBoundingClientRect();
    if (clientX >= r.left && clientX <= r.right &&
        clientY >= r.top  && clientY <= r.bottom){
      return cell;
    }
  }
  return null;
}

let lastOverCell = null;
function setOverCell(cell){
  if (lastOverCell === cell) return;
  if (lastOverCell) lastOverCell.classList.remove('over');
  lastOverCell = cell;
  if (cell) cell.classList.add('over');
}

/* ===== ドラッグ ===== */
let dragState = null;
let ghostEl = null;

function isRedToken(t){ return t === '+1' || t === '-1'; }
function displayToken(t){ return t === '+1' ? '1' : t; }

function makeGhost(token){
  const g = document.createElement('div');
  g.className = 'ghost-token';
  if (isRedToken(token)) g.classList.add('red');
  g.textContent = displayToken(token);
  return g;
}

$$('.palette [data-token]').forEach(btn => {
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    startPaletteDrag(btn.dataset.token, e);
  });
});

function startPaletteDrag(token, e){
  if (dragState) return;
  dragState = { token, moved:false };

  document.body.classList.add('dragging');
  ghostEl = makeGhost(token);
  ghostEl.style.left = e.clientX + 'px';
  ghostEl.style.top  = e.clientY + 'px';
  document.body.appendChild(ghostEl);

  document.addEventListener('pointermove', onGlobalMove, { passive:false });
  document.addEventListener('pointerup', onGlobalUp);
  document.addEventListener('pointercancel', onGlobalUp);
}

function onGlobalMove(e){
  if (!dragState || !ghostEl) return;
  e.preventDefault();
  dragState.moved = true;
  ghostEl.style.left = e.clientX + 'px';
  ghostEl.style.top  = e.clientY + 'px';

  if (!isRedToken(dragState.token)){
    setOverCell(findCellAtPoint(e.clientX, e.clientY));
  } else {
    setOverCell(null);
  }
}

function onGlobalUp(e){
  document.removeEventListener('pointermove', onGlobalMove);
  document.removeEventListener('pointerup', onGlobalUp);
  document.removeEventListener('pointercancel', onGlobalUp);

  document.body.classList.remove('dragging');
  setOverCell(null);

  if (!dragState){ if (ghostEl){ ghostEl.remove(); ghostEl = null; } return; }

  const token = dragState.token;
  const moved = dragState.moved;
  if (ghostEl){ ghostEl.remove(); ghostEl = null; }
  dragState = null;

  if (!moved) return;

  const areaRect = problemArea.getBoundingClientRect();
  const palRect  = palette.getBoundingClientRect();
  const x = e.clientX, y = e.clientY;

  const overPalette = x >= palRect.left && x <= palRect.right &&
                      y >= palRect.top  && y <= palRect.bottom;
  const inArea = x >= areaRect.left && x <= areaRect.right &&
                 y >= areaRect.top  && y <= areaRect.bottom;

  if (overPalette) return;

  if (isRedToken(token)){
    if (inArea) createFloatingRedToken(token, x - areaRect.left, y - areaRect.top);
  } else {
    const cell = findCellAtPoint(x, y);
    if (cell) placeNumberInCell(cell, token);
  }
}

function placeNumberInCell(cell, token){
  clearCheckFeedback();
  cell.textContent = token;
  cell.dataset.placed = token;
  cell.classList.remove('justFilled');
  void cell.offsetWidth;
  cell.classList.add('justFilled');
}

function createFloatingRedToken(token, x, y){
  const el = document.createElement('div');
  el.className = 'dropped-token';
  el.dataset.token = token;
  el.style.left = x + 'px';
  el.style.top  = y + 'px';

  const num = document.createElement('span');
  num.className = 'token-num';
  num.textContent = displayToken(token);
  num.style.pointerEvents = 'none';
  el.appendChild(num);

  const del = document.createElement('button');
  del.className = 'del-x';
  del.textContent = '×';
  del.setAttribute('aria-label','けす');

  del.addEventListener('pointerdown', ev=>{
    ev.preventDefault();
    ev.stopPropagation();
  });
  del.addEventListener('click', ev=>{
    ev.preventDefault();
    ev.stopPropagation();
    el.remove();
  });
  el.appendChild(del);

  el.addEventListener('pointerdown', onDroppedDown);
  droppedLayer.appendChild(el);
}

function onDroppedDown(e){
  e.preventDefault();
  e.stopPropagation();

  const el = e.currentTarget;
  const areaRect = problemArea.getBoundingClientRect();

  el.classList.add('dragging');

  function move(ev){
    ev.preventDefault();
    el.style.left = (ev.clientX - areaRect.left) + 'px';
    el.style.top  = (ev.clientY - areaRect.top)  + 'px';
  }

  function up(ev){
    el.classList.remove('dragging');
    el.removeEventListener('pointermove', move);
    el.removeEventListener('pointerup', up);
    el.removeEventListener('pointercancel', up);

    const palRect = palette.getBoundingClientRect();
    const overPalette = ev.clientX >= palRect.left && ev.clientX <= palRect.right &&
                        ev.clientY >= palRect.top  && ev.clientY <= palRect.bottom;
    const outOfArea = ev.clientX < areaRect.left || ev.clientX > areaRect.right ||
                      ev.clientY < areaRect.top  || ev.clientY > areaRect.bottom;

    if (overPalette || outOfArea) el.remove();
  }

  el.addEventListener('pointermove', move, { passive:false });
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
}

/* ===== リセット ===== */
function clearAllTokens(){
  while (droppedLayer.firstChild) droppedLayer.removeChild(droppedLayer.firstChild);
  $$('#pgrid .cell.droppable').forEach(cell=>{
    const orig = cell.dataset.orig || '';
    cell.textContent = orig;
    delete cell.dataset.placed;
    cell.classList.remove('justFilled');
  });
  clearCheckFeedback();
}

/* ===== まるつけ (先頭 の 0 を ゆるす) ===== */
function clearCheckFeedback(){
  $$('#pgrid .cell.answer').forEach(c=>{
    c.classList.remove('correct','wrong','missing');
  });
}

let toastTimer = null;
function showToast(msg, ok){
  toast.textContent = msg;
  toast.classList.toggle('error', !ok);
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toast.classList.remove('show'), 2200);
}

function checkAnswer(){
  if (!S.started) return;

  const realOp = S.op;
  const correct = (realOp === '+') ? (S.a + S.b) : (S.a - S.b);

  const answerCells = $$('#pgrid .answer.droppable');
  const cols = answerCells.length;

  let raw = '';
  let anyInput = false;
  answerCells.forEach(cell => {
    const v = (cell.textContent || '').trim();
    if (v !== '') anyInput = true;
    raw += (v === '') ? '0' : v;
  });

  if (!anyInput){
    showToast('こたえを いれてね ✏️', false);
    clearCheckFeedback();
    return;
  }

  const studentNum = parseInt(raw, 10);
  const studentNumSafe = isNaN(studentNum) ? 0 : studentNum;

  if (studentNumSafe === correct){
    answerCells.forEach(c => {
      c.classList.remove('correct','wrong','missing');
      if ((c.textContent || '').trim() !== '') c.classList.add('correct');
    });
    showToast('🎉 せいかい！ すごい！', true);
    return;
  }

  const expected = String(correct).split('');
  while (expected.length < cols) expected.unshift('');

  answerCells.forEach((cell, i) => {
    cell.classList.remove('correct','wrong','missing');
    const studentVal = (cell.textContent || '').trim();
    const expVal = expected[i] || '';
    if (studentVal !== expVal){
      if (studentVal === '') cell.classList.add('missing');
      else cell.classList.add('wrong');
    }
  });

  showToast('❌ おしい！ もういちど やってみよう', false);
}

/* ===== ボタン ===== */
$('#startBtn').addEventListener('click', buildProblem);
$('#newBtn').addEventListener('click', buildProblem);
$('#clearBtn').addEventListener('click', eraseLastStroke);
$('#cleanTokensBtn').addEventListener('click', clearAllTokens);
$('#checkBtn').addEventListener('click', checkAnswer);

/* ===== さいしょ ===== */
function boot(){
  render();
  syncNumSize();
  fit();
  setTimeout(()=>{ syncNumSize(); fit(); }, 120);
  setTimeout(()=>{ syncNumSize(); fit(); }, 500);
}

window.addEventListener('resize', ()=> setTimeout(()=>{ syncNumSize(); fit(); }, 80));
window.addEventListener('orientationchange', ()=> setTimeout(()=>{ syncNumSize(); fit(); }, 250));

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => {
  if (e.target === canvas) e.preventDefault();
}, { passive:false });

if (document.readyState === 'complete') boot();
else window.addEventListener('load', boot);

})();
</script>
